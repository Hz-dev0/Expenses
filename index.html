  <!-- Firebase SDK（改為動態載入：離線或載入失敗時不會卡住整個 App） -->
  <script type="module">
    const FB_BASE  = 'https://www.gstatic.com/firebasejs/10.12.2/';
    const AUTH_KEY = 'kakeibo_authed_uid';   // 曾通過驗證的帳號：離線時憑此直接進入
    const firebaseConfig = {
      apiKey: "AIzaSyAKpdKG7Z9VftOewWAF8icxJDlyt-za8R4",
      authDomain: "counter-e1ce2.firebaseapp.com",
      projectId: "counter-e1ce2",
      storageBucket: "counter-e1ce2.firebasestorage.app",
      messagingSenderId: "1079520607651",
      appId: "1:1079520607651:web:d75a7447f1c6de3e5e2e16"
    };

    const $     = id => document.getElementById(id);
    const lsGet = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
    const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} };
    const lsDel = k => { try { localStorage.removeItem(k); } catch(e) {} };
    const withTimeout = (p, ms) => Promise.race([
      p,
      new Promise((_, rej) => setTimeout(() => rej(Object.assign(new Error('timeout'), { code: 'timeout' })), ms))
    ]);

    let fb = null;            // Firebase 模組（載入成功才有值）
    let booting = null;
    let authResolved = false;
    let synced = false;       // 本次連線是否已與雲端合併過

    function showLogin({ denied = false, badge = 'GOOGLE 登入' } = {}) {
      $('loginOverlay').style.display = 'flex';
      $('loginDenied').style.display = denied ? 'block' : 'none';
      $('loginUidHint').style.display = 'none';
      $('googleSignInBtn').style.display = 'flex';
      const b = $('loginSyncBadge');
      b.textContent = badge;
      b.style.userSelect = '';
    }

    // 進入 App（可離線；有雲端帳號且在線時會同步）
    function startApp() {
      $('loginOverlay').style.display = 'none';
      if (window._appInited) return;
      window._appInited = true;
      synced = !!window._fbUser && navigator.onLine;
      window._fbLoadAndInit();
    }

    // 離線期間進入或離線後恢復連線 → 重新與雲端合併一次
    function ensureSynced() {
      if (synced || !window._fbUser || !navigator.onLine || !window._appInited) return;
      synced = true;
      window._fbLoadAndInit();
    }

    async function onUser(user) {
      authResolved = true;
      const saved = lsGet(AUTH_KEY);

      if (!user) {
        window._fbUser = null;
        if (!navigator.onLine && saved) { startApp(); return; }
        showLogin({ badge: navigator.onLine ? 'GOOGLE 登入' : '離線中・首次使用需連線登入' });
        return;
      }

      // 離線：曾驗證過的帳號直接放行（本機資料）
      if (!navigator.onLine) {
        if (saved === user.uid) { window._fbUser = user; startApp(); }
        else { window._fbUser = null; showLogin({ badge: '離線中・首次使用需連線登入' }); }
        return;
      }

      // 在線：用 Firestore Rules 當守門員，不在前端放任何白名單
      try {
        await withTimeout(
          fb.setDoc(fb.doc(fb.db, 'users', user.uid, 'meta', '_ping'), { ts: Date.now() }),
          8000
        );
      } catch (e) {
        if (e && e.code === 'permission-denied') {
          lsDel(AUTH_KEY);
          try { await fb.signOut(fb.auth); } catch(_) {}
          window._fbUser = null;
          showLogin({ denied: true });
          return;
        }
        // 網路不穩 / 逾時：曾驗證過就放行，否則請稍後再試
        if (saved === user.uid) { window._fbUser = user; startApp(); }
        else { window._fbUser = null; showLogin({ badge: '無法連線驗證，請稍後再試' }); }
        return;
      }

      lsSet(AUTH_KEY, user.uid);
      window._fbUser = user;
      startApp();
      ensureSynced();
    }

    function bootFirebase() {
      if (fb) return Promise.resolve();
      if (booting) return booting;
      booting = (async () => {
        try {
          const [A, Au, F] = await Promise.all([
            import(FB_BASE + 'firebase-app.js'),
            import(FB_BASE + 'firebase-auth.js'),
            import(FB_BASE + 'firebase-firestore.js')
          ]);
          const app  = A.initializeApp(firebaseConfig);
          const auth = Au.getAuth(app);
          const db   = F.getFirestore(app);
          fb = {
            auth, db,
            GoogleAuthProvider: Au.GoogleAuthProvider, signInWithPopup: Au.signInWithPopup,
            onAuthStateChanged: Au.onAuthStateChanged, signOut: Au.signOut,
            doc: F.doc, setDoc: F.setDoc, deleteDoc: F.deleteDoc, getDoc: F.getDoc,
            collection: F.collection, getDocs: F.getDocs, onSnapshot: F.onSnapshot
          };
          window._fb = fb;   // 掛到 window，讓非 module 的 script 可以存取
          fb.onAuthStateChanged(auth, onUser);
        } catch (e) {
          console.warn('[FB] 載入失敗（可能離線）', e);
          fb = null;
        } finally {
          booting = null;
        }
      })();
      return booting;
    }

    window._googleSignIn = async () => {
      if (!fb) await bootFirebase();
      if (!fb) { alert('目前無法連線。請在有網路時登入一次，之後即可離線使用。'); return; }
      try {
        $('loginDenied').style.display = 'none';
        await fb.signInWithPopup(fb.auth, new fb.GoogleAuthProvider());
      } catch (e) {
        console.error('登入失敗', e);
        alert('登入失敗：' + e.message);
      }
    };

    // ── 啟動 ──
    // 離線且曾登入過：不等 Firebase，直接用本機資料進入
    // 曾登入過：不論在線與否都先用本機資料進入；Auth 確認後再於背景與雲端合併
    // （若 Auth 回報未登入／無權限，onUser 會再顯示登入畫面）
    if (lsGet(AUTH_KEY)) startApp();

    bootFirebase().then(() => {
      if (!fb && !window._appInited) {   // Firebase 載入失敗（離線或被擋）
        if (lsGet(AUTH_KEY)) startApp();
        else showLogin({ badge: navigator.onLine ? '無法載入登入元件' : '離線中・首次使用需連線登入' });
      }
    });

    // 保險：Auth 初始化卡住時，曾登入過的裝置 5 秒後直接進入
    setTimeout(() => {
      if (!authResolved && !window._appInited && lsGet(AUTH_KEY)) startApp();
    }, 5000);

    window.addEventListener('online',  async () => { await bootFirebase(); ensureSynced(); });
    window.addEventListener('offline', () => { synced = false; });
  </script>
  <style>
    :root {
      --rose:   #e8b8b8;
      --roseDk: #c99090;
      --accent: #8c6f6f;
      --text:   #4a3a3a;
      --muted:  #a88888;
      --card:   #fff;
      --bg1:    #fdf6f6;
      --bg2:    #f7e8e8;
      --bdr:    rgba(220,170,170,0.25);
      --shd:    rgba(220,170,170,0.18);
      --danger: #e07070;
      --kb-h:   256px;
      /* 收起時只露出金額列（含底部安全區） */
      --kb-bar-h: calc(50px + env(safe-area-inset-bottom, 0px));
      --kb-ease: cubic-bezier(.32,.72,0,1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    html { background: var(--bg1); }
    /* 漸層背景放在獨立的固定圖層，滑動／捲動時不必重畫（原本的 background-attachment: fixed 在手機上很吃力） */
    body::before {
      content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: linear-gradient(170deg, var(--bg1) 0%, var(--bg2) 100%);
    }

    body {
      font-family: "Noto Sans TC", sans-serif;
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;   /* 手機網址列會讓 100vh 比可視高度大，導致空白頁也能捲動 */
      overflow-x: hidden;
      touch-action: pan-y;   /* 橫向手勢交給 JS（切換分頁），避免被瀏覽器當成捲動而中斷 */
      -webkit-user-select: none;
      user-select: none;
      --kb-vis: var(--kb-h);               /* 鍵盤目前露出的高度 */
      padding-bottom: calc(var(--kb-vis) + 8px);
      transition: padding-bottom .3s var(--kb-ease);
    }
    body.kb-collapsed { --kb-vis: var(--kb-bar-h); }


    /* ── 固定標題列（月份／總額／分頁標籤）：用 fixed 而不是 sticky，iOS 下拉回彈時也不會跟著晃 ── */
    #topBar {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 90;                      /* 低於記帳區(100)與各種彈窗 */
      background: var(--bg1);
      box-shadow: 0 4px 12px -6px rgba(200,150,150,0.28);
    }
    #topBarSpacer { height: 120px; }    /* 預設高度，實際高度由 JS 量測後覆蓋 */

    /* ── TOP ── */
    #top {
      padding: max(env(safe-area-inset-top, 20px), 20px) 18px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .mnav { display: flex; align-items: center; gap: 4px; }

    .mb {
      background: none;
      border: none;
      color: var(--rose);
      font-size: 24px;
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mb:active { background: rgba(220,170,170,0.18); }

    #mLabel {
      font-family: "Montserrat", sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .4px;
      color: var(--text);
      min-width: 90px;
      text-align: center;
    }

    #totalAmt {
      font-family: "Montserrat", sans-serif;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 1;
      color: var(--text);
      text-align: right;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: color .2s;
    }
    #totalAmt .cur {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0;
      vertical-align: 2px;
      margin-right: 1px;
    }
    /* 三種顯示模式的顏色：全部 = 原本的顏色；預算內／預算外 = 分析頁圖形條的柔和色（CAT_C_POOL） */
    #totalAmt.m1 { color: #b8e8cc; }
    #totalAmt.m2 { color: #e8b8b8; }
    #totalAmt.over {
      color: var(--danger);
      animation: overPulse .4s ease;
    }
    #totalAmt.over .cur { color: var(--danger); opacity: .7; }
    @keyframes overPulse {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    #budgetHint {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .5px;
      color: var(--muted);
      text-align: right;
      margin-top: 1px;
      opacity: .6;
      line-height: 1;
      min-height: 12px;
    }
    #totalModeTip {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      pointer-events: none;
      z-index: 150;
    }
    #totalModeTip span {
      background: rgba(140,111,111,0.82);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .8px;
      padding: 5px 14px;
      border-radius: 0 0 12px 12px;
      opacity: 0;
      transform: translateY(-100%);
      transition: opacity .2s, transform .2s;
      white-space: nowrap;
    }
    #totalModeTip span.m1 { background: #b8e8cc; color: var(--text); }   /* 柔和底色配深色字才看得清楚 */
    #totalModeTip span.m2 { background: #e8b8b8; color: var(--text); }
    #totalModeTip span.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── TABS ── */
    #tabs {
      display: flex;
      margin: 0 14px 10px;
      background: rgba(255,255,255,0.55);
      border-radius: 13px;
      border: 1px solid var(--bdr);
      overflow: hidden;
      padding: 3px;
      gap: 3px;
    }

    .tb {
      flex: 1;
      padding: 7px 0;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      color: var(--muted);
      background: none;
      border: none;
      border-radius: 10px;
      letter-spacing: .8px;
    }
    .tb.on { background: var(--rose); color: #fff; box-shadow: 0 2px 8px var(--shd); }

    /* ── SCROLL ── */
    #scrollArea { padding: 0; }

    /* ── LIST ── */
    .dg-head {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 1.2px;
      padding: 10px 4px 5px;
      display: flex;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    .dg-head:active { opacity: .65; }
    .dg-arrow { margin-right: 4px; font-size: 9px; color: var(--rose); }

    .ri {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 13px;
      background: var(--card);
      border-radius: 14px;
      margin-bottom: 6px;
      border: 1px solid var(--bdr);
      box-shadow: 0 2px 10px var(--shd);
      animation: fi .2s ease;
    }
    @keyframes fi {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: none; }
    }

    .ri-ico {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fdf0f0, #f5dede);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }
    .ri-info  { flex: 1; min-width: 0; -webkit-user-select: none; user-select: none; cursor: pointer; }
    .ri-note  { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ri-cat   { font-size: 10px; color: var(--muted); margin-top: 1px; }
    .ri-amt   { font-family: "Montserrat", sans-serif; font-size: 15px; font-weight: 800; white-space: nowrap; cursor: pointer; }
    .ri-amt small { font-size: 10px; color: var(--muted); font-weight: 500; margin-right: 1px; }
    .ri-amt.exempt { color: var(--muted); }
    .ri.exempt-row {
      background: repeating-linear-gradient(
        135deg,
        rgba(220,170,170,0.07) 0px,
        rgba(220,170,170,0.07) 8px,
        transparent 8px,
        transparent 16px
      );
      border-color: rgba(220,170,170,0.15);
      opacity: .72;
    }

    .ri-del {
      background: none;
      border: none;
      color: rgba(200,150,150,0.35);
      font-size: 13px;
      cursor: pointer;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .ri-del:active { color: var(--danger); background: rgba(224,112,112,0.1); }

    .empty     { text-align: center; padding: 36px 20px; color: var(--muted); font-size: 13px; opacity: .65; }
    .empty-ico { font-size: 30px; margin-bottom: 8px; opacity: .4; }

    /* ── 分析 ── */
    #anaPanel { }

    .ana-total {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--bdr);
      box-shadow: 0 2px 10px var(--shd);
      padding: 16px;
      margin-bottom: 10px;
      text-align: center;
    }
    .ana-total-label { font-size: 10px; color: var(--muted); letter-spacing: 1.5px; margin-bottom: 4px; }
    .ana-total-num {
      font-family: "Montserrat", sans-serif;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--text);
    }
    .ana-total-num small { font-size: 14px; color: var(--muted); font-weight: 600; margin-right: 2px; }

    .ana-stack-wrap {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--bdr);
      box-shadow: 0 2px 10px var(--shd);
      padding: 14px 16px;
      margin-bottom: 10px;
    }

    .stack-bar {
      height: 20px;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      margin-bottom: 10px;
      background: rgba(220,170,170,0.1);
    }
    .stack-seg { height: 100%; }

    .cat-card {
      background: var(--card);
      border-radius: 14px;
      border: 1px solid var(--bdr);
      box-shadow: 0 2px 10px var(--shd);
      padding: 12px 14px;
      margin-bottom: 7px;
    }
    .cat-card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .cat-dot  { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .cat-name { flex: 1; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
    .cat-pct  { font-family: "Montserrat", sans-serif; font-size: 11px; color: var(--muted); font-weight: 700; }
    .cat-amt  { font-family: "Montserrat", sans-serif; font-size: 15px; font-weight: 800; color: var(--text); margin-left: 8px; }
    .cat-amt small { font-size: 10px; color: var(--muted); font-weight: 500; margin-right: 1px; }

    .bar-bg   { height: 6px; border-radius: 3px; background: rgba(220,170,170,0.12); }
    .bar-fill { height: 100%; border-radius: 3px; }
    .ana-empty { text-align: center; padding: 30px; color: var(--muted); font-size: 13px; opacity: .6; }

    /* ── 浮動鍵盤 ── */
    #kb {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--kb-h);
      background: rgb(254,250,250);   /* 不透明：移動時不必每幀重算毛玻璃模糊，動畫更順 */
      will-change: transform;
      transition: transform .3s var(--kb-ease);
      border-top: 1px solid var(--bdr);
      border-radius: 22px 22px 0 0;
      box-shadow: 0 -4px 28px rgba(200,150,150,0.14);
      padding: 9px 12px max(env(safe-area-inset-bottom, 0px), 4px);
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 6px;
      z-index: 100;
    }

    /* 收起：整個鍵盤往下滑，只留金額列（用 transform，走 GPU，比改 height 順） */
    body.kb-collapsed #kb { transform: translateY(calc(var(--kb-h) - var(--kb-bar-h))); }
    body.kb-collapsed #kc { display: none !important; }
    .kb-r2, .kb-r3 { transition: visibility 0s; }
    body.kb-collapsed .kb-r2, body.kb-collapsed .kb-r3 { visibility: hidden; transition: visibility 0s .3s; }
    #kbHandle {
      position: absolute; top: 3px; left: 50%;
      width: 36px; height: 4px; margin-left: -18px;
      border-radius: 2px; background: rgba(200,150,150,.35);
      pointer-events: none;   /* 純裝飾；觸控目標太小，手機會被吸到旁邊的按鈕 */
    }
    body.kb-collapsed #amtDisp { cursor: pointer; }
    @media (prefers-reduced-motion: reduce) {
      #kb, body { transition: none; }
    }

    .kb-r1 {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 8px 2px 0;     /* 往上多吃 8px 當作可滑動／點擊的區域，內容位置不變 */
      margin-top: -8px;
      touch-action: none;
    }

    #amtDisp {
      font-family: "Montserrat", sans-serif;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 1;
      grid-column: 1;
    }
    #amtDisp .cur { font-size: 12px; color: var(--muted); font-weight: 600; margin-right: 2px; vertical-align: 2px; }

    .ph { color: var(--rose) !important; opacity: .45; }
    .kb-cur {
      display: inline-block;
      width: 2px;
      height: 26px;
      background: var(--rose);
      vertical-align: middle;
      margin-left: 2px;
      animation: blink .9s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    #saveBtn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
      opacity: .55;
      transition: opacity .15s;
      grid-column: 2;
      justify-self: center;
    }
    #saveBtn:active { opacity: 1; }

    #dateLbl {
      font-family: "Noto Sans TC", sans-serif;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      text-align: right;

    /* ── Panel wrap for swipe ── */
    #scrollArea {
      overflow: visible;
    }
    #panelClip {
      overflow: hidden;
      width: 100%;
    }
    #panelWrap {
      display: flex;
      align-items: flex-start;   /* 各分頁依自己的內容高度，不被最長的分頁撐高 */
      width: 300%;
      transition: transform .32s cubic-bezier(.4,0,.2,1);
      will-change: transform;
    }
    #panelWrap.notransition { transition: none; }
    /* 切換動畫結束後，非目前分頁收合成 0 高度，避免預算頁下方出現大片空白 */
    #panelWrap.settled > .swipe-panel:not(.is-active) {
      height: 0; overflow: hidden; visibility: hidden; padding-top: 0; padding-bottom: 0;
    }
    /* 滑動／切換期間，被滑進來的分頁只需要畫一個螢幕高度，避免一開始滑就要畫整份長清單而卡一下 */
    .swipe-panel.peek:not(.is-active) { max-height: 100vh; max-height: 100dvh; overflow: hidden; }
    .swipe-panel {
      width: 33.333%;
      flex-shrink: 0;
      min-width: 0;
      padding: 0 14px;
      box-sizing: border-box;
    }

    .kb-r2 { display: flex; }

    .note-inp {
      flex: 1;

      -webkit-user-select: auto;

    .nb {
      border-radius: 11px;
      border: 1.5px solid var(--bdr);
      background: rgba(230,180,180,0.07);
      font-family: "Montserrat", sans-serif;
      font-size: 19px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nb.pressed { background: var(--rose); color: #fff; border-color: var(--rose); }
    .nb.del { font-size: 15px; color: var(--muted); }
    .nb.del.pressed { background: rgba(200,150,150,0.15); color: var(--accent); border-color: transparent; }
    .nb.ok {
      background: linear-gradient(135deg, #ebb8b8, #d49898);

    }
    .nb.ok.pressed { background: var(--accent); }

    .cbt {
      border-radius: 11px;
      border: 1.5px solid var(--bdr);
      background: rgba(235,185,185,0.08);
      font-size: 19px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      /* 讓長按不觸發系統選單，但仍允許在捲動清單中垂直滑動 */
      -webkit-touch-callout: none;
      touch-action: pan-y;
      position: relative;
    }
    .cbt.on      { background: var(--rose); border-color: var(--rose); box-shadow: 0 2px 8px rgba(220,160,160,0.4); }
    .cbt.pressed { opacity: .65; }
    .cbt.cbt-unsplit { border-style: dashed; background: rgba(168,136,136,0.08); }
    .cbt.cbt-unsplit.on { border-style: solid; background: var(--accent); border-color: var(--accent); }

    .cbt { -webkit-user-select: none; user-select: none; }
    .cbt.has-sub::after {
      content: ''; position: absolute; top: 4px; right: 4px;
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent); border: 1.5px solid #fff;
    }
    /* 長按分類 → 子分類彈出面板 */
    .sub-pop {
      position: fixed; z-index: 9999;
      background: var(--card); border: 1.5px solid var(--bdr);
      border-radius: 14px; padding: 6px;
      box-shadow: 0 8px 28px rgba(120,80,80,0.28);

      touch-action: none;
      animation: subPopIn .12s ease-out;

    @keyframes subPopIn { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }
    .sub-pop-head { font-size: 12px; font-weight: 700; color: var(--muted); padding: 2px 8px 6px; }
    .sub-pop-list { display: grid; grid-template-columns: repeat(var(--cols, 1), minmax(96px, 1fr)); gap: 4px; }
    .sub-pop-item {
      padding: 12px 14px; border-radius: 10px; font-size: 15px; font-weight: 600;
      color: var(--text); background: rgba(235,185,185,0.10);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sub-pop-item.cur   { border: 1.5px solid var(--rose); }
    .sub-pop-item.hover { background: var(--rose); color: #fff; transform: scale(1.04); }

    /* 待拆帳 Modal */

<!-- TOAST -->
<div id="toast"></div>

<script>
  /* ── 分類（可自由新增/刪除/排序） ── */
  // CATS_LIST 為唯一真實來源（順序 = 顯示順序），CATS / CKEYS 由它派生
  let CATS_LIST = [
    { key: 'food',  icon: '🍴', lbl: '食物'  },
    { key: 'snack', icon: '🍫', lbl: '零食'  },
    { key: 'fun',   icon: '✨', lbl: '娛樂'  },
    { key: 'daily', icon: '🧻', lbl: '日用品' },
  ];
  // 特殊分類：待拆帳。永遠存在、不可刪除、不計入預算規劃/分析統計。
  const UNSPLIT_KEY = 'unsplit';
  const UNSPLIT_CAT = { key: UNSPLIT_KEY, icon: '✂️', lbl: '待拆帳' };
  // 分類被刪除後，舊紀錄的分類顯示用回退物件
  const UNCATEGORIZED = { icon: '🏷️', lbl: '未分類' };

  const CAT_C_POOL = ['#e8b8b8','#b8d4e8','#b8e8cc','#e8ddb8','#d8c4e8','#e8c4a8','#a8d8d0','#e8a8c0','#c8d8a0','#a8c0e8'];
  const catColor = (i) => CAT_C_POOL[i % CAT_C_POOL.length];

  let _catSeq = 1; // 新分類 key 自增序號
  const newCatKey = () => 'cat' + (_catSeq++) + '_' + Date.now().toString(36);

  const CKEYS = []; // 動態：一般分類 key 清單（不含 unsplit），由 rebuildCats() 填入
  let CATS = {};    // 動態：依 key 查找（含 unsplit）

  const SK      = 'kakeibo_v2';
  const SK_LBL  = 'kakeibo_labels';
  const SK_ICONS = 'kakeibo_icons';
  const SK_CATS = 'kakeibo_cats_list';
  const SK_BDG  = 'kakeibo_budget';
  const SK_MODE = 'kakeibo_budget_mode';
  const SK_CAT  = 'kakeibo_last_cat';  // 最後使用的分類（不含待拆帳）
  const IDB_NAME = 'kakeibo_db';
  const IDB_VER  = 1;
  const IDB_STORE = 'data';

  /* ── IndexedDB 層 ── */
  let _idb = null;

  function openIDB() {
    return new Promise((res, rej) => {
      if (_idb) { res(_idb); return; }
      const req = indexedDB.open(IDB_NAME, IDB_VER);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(IDB_STORE))
          db.createObjectStore(IDB_STORE);
      };
      req.onsuccess = e => { _idb = e.target.result; res(_idb); };
      req.onerror   = () => rej(req.error);
    });
  }

  function idbSet(key, val) {
    return openIDB().then(db => new Promise((res, rej) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(val, key);
      tx.oncomplete = res;
      tx.onerror    = () => rej(tx.error);
    })).catch(err => { console.error('[IDB] idbSet failed:', key, err); });
  }

  function idbGet(key) {
    return openIDB().then(db => new Promise((res, rej) => {
      const req = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(key);
      req.onsuccess = () => res(req.result);
      req.onerror   = () => rej(req.error);
    })).catch(() => null);
  }

  /* ── 工具函式（雙寫：IDB 主要 + localStorage 備份）── */
  const save = () => {
    const v = JSON.stringify(recs);
    let lsOk = false;
    // 同時追蹤 IDB（主要）和 localStorage（備份），兩邊都失敗才警告
    idbSet(SK, v).catch(() => {
      // IDB 失敗時，確認 localStorage 是否也已失敗
      if (!lsOk) {
        console.error('[save] Both IDB and localStorage failed — storage may be full');
        toast('⚠️ 儲存失敗！請立即匯出備份');
      }
    });
    try { localStorage.setItem(SK, v); lsOk = true; } catch(e) {
      lsOk = false;
    }
  };
  const saveCats = () => {
    const v = JSON.stringify(CATS_LIST);
    idbSet(SK_CATS, v);
    try { localStorage.setItem(SK_CATS, v); } catch(e) {}
    fbSyncMeta(SK_CATS, v);
  };
  const saveBdg = () => {
    const v = String(budget);
    idbSet(SK_BDG, v);
    try { localStorage.setItem(SK_BDG, v); } catch(e) {}
    fbSyncMeta(SK_BDG, v);
  };
  const saveMode = () => {
    const v = String(totalMode);
    idbSet(SK_MODE, v);
    try { localStorage.setItem(SK_MODE, v); } catch(e) {}
  };

  /* ── 讀取（優先 IDB，fallback localStorage，雙向補齊）── */
  async function loadAll() {
    // recs
    try {
      const idbVal = await idbGet(SK);
      const lsVal  = localStorage.getItem(SK);
      if (idbVal) {
        recs = JSON.parse(idbVal);
        if (!lsVal) { try { localStorage.setItem(SK, idbVal); } catch(e) {} } // IDB 有、LS 沒有 → 補 LS
      } else if (lsVal) {
        recs = JSON.parse(lsVal);
        idbSet(SK, lsVal); // LS 有、IDB 沒有 → 補 IDB（含遷移舊資料）
      }
    } catch(e) {
      try { const ls = localStorage.getItem(SK); if (ls) recs = JSON.parse(ls); } catch(e2) {}
    }
    // 分類清單（新格式，含順序、新增/刪除）
    let catsListLoaded = false;
    try {
      const idbVal = await idbGet(SK_CATS);
      const lsVal  = localStorage.getItem(SK_CATS);
      const v = idbVal || lsVal;
      if (v) {
        const saved = JSON.parse(v);
        if (Array.isArray(saved) && saved.length > 0) {
          CATS_LIST = saved;
          catsListLoaded = true;
        }
        if (idbVal && !lsVal) { try { localStorage.setItem(SK_CATS, idbVal); } catch(e) {} }
        if (!idbVal && lsVal) { idbSet(SK_CATS, lsVal); }
      }
    } catch(e) {}

    // 舊版相容：若沒有新格式分類清單，套用舊版 labels/icons 覆寫到預設分類上
    if (!catsListLoaded) {
      try {
        const idbVal = await idbGet(SK_LBL);
        const lsVal  = localStorage.getItem(SK_LBL);
        const v = idbVal || lsVal;
        if (v) {
          const saved = JSON.parse(v);
          CATS_LIST.forEach(c => { if (saved[c.key]) c.lbl = saved[c.key]; });
        }
      } catch(e) {}
      try {
        const idbVal = await idbGet(SK_ICONS);
        const lsVal  = localStorage.getItem(SK_ICONS);
        const v = idbVal || lsVal;
        if (v) {
          const saved = JSON.parse(v);
          CATS_LIST.forEach(c => { if (saved[c.key]) c.icon = saved[c.key]; });
        }
      } catch(e) {}
    }

    // bdgPlan
    try {
      const idbVal = await idbGet(SK_BDGPLAN);
      const lsVal  = localStorage.getItem(SK_BDGPLAN);
      const v = idbVal || lsVal;
      if (v) {
        const saved = JSON.parse(v);
        if (typeof saved === 'object' && !Array.isArray(saved)) {
          bdgPlan = saved;
          Object.values(bdgPlan).forEach(p => {
            (p.subs||[]).forEach(s => { if (s.id >= _subId) _subId = s.id + 1; });
          });
        }
        if (idbVal && !lsVal) { try { localStorage.setItem(SK_BDGPLAN, idbVal); } catch(e) {} }
        if (!idbVal && lsVal) { idbSet(SK_BDGPLAN, lsVal); }
      }
    } catch(e) {}

    // budget
    try {
      const idbVal = await idbGet(SK_BDG);
      const lsVal  = localStorage.getItem(SK_BDG);
      const v = idbVal !== null && idbVal !== undefined ? idbVal : lsVal;
      if (v !== null && v !== undefined) budget = parseInt(v, 10) || 0;
    } catch(e) {}

    // budget mode
    try {
      const idbVal = await idbGet(SK_MODE);
      const lsVal  = localStorage.getItem(SK_MODE);
      const v = idbVal !== null && idbVal !== undefined ? idbVal : lsVal;
      if (v !== null && v !== undefined) totalMode = parseTotalMode(v);
    } catch(e) {}
  }

  // 保留 localStorage 同步備援（供 idbGet fallback 內部使用）

  /* ── 全域狀態 ── */
  let recs         = [];
  let inp          = '';
  let cat          = 'food';
  let vy, vm;
  let ctab         = 'list';
  let collapsed    = {};
  let renameTarget = null;
  let budget       = 0;
  let totalMode = 0;   // 右上角總額顯示：0 全部 / 1 預算內 / 2 預算外
  const parseTotalMode = v => (v === '2' ? 2 : v === '1' ? 1 : 0);
  const TOTAL_MODE_NAMES = ['全部', '預算內', '預算外'];
  const modeMrs = mrs => totalMode === 1 ? mrs.filter(r => !r.exempt)
                       : totalMode === 2 ? mrs.filter(r => r.exempt) : mrs;
  let _nextId = Date.now(); // 自增 id，避免同毫秒碰撞

  const rebuildCats = () => {
    CATS = {};
    CKEYS.length = 0;
    CATS_LIST.forEach(c => {
      CATS[c.key] = { icon: c.icon, lbl: c.lbl, hist: c.hist };
      CKEYS.push(c.key);
    });
    CATS[UNSPLIT_KEY] = { icon: UNSPLIT_CAT.icon, lbl: UNSPLIT_CAT.lbl };
  };

  /* ── 名稱歷史：改名只影響「改名當月起」，過去月份的紀錄仍顯示當時的名稱 ──
     hist = { '0000-00': 最早的舊名, 'YYYY-MM': 該月起的名稱 }；某月的名稱 = 不晚於該月的最近一筆 */
  const todayYM = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
  function histName(hist, base, ym) {
    if (!hist || !ym) return base;
    let best = null;
    for (const m in hist) if (m <= ym && (best === null || m > best)) best = m;
    return best === null ? base : hist[best];
  }
  function pushNameHist(obj, field, newVal) {
    const old = obj[field];
    if (old === newVal) return false;
    if (!obj.hist) obj.hist = { '0000-00': old };
    obj.hist[todayYM()] = newVal;
    obj[field] = newVal;
    return true;
  }
  const catLbl = (k, ym) => { const c = CATS[k]; return c ? histName(c.hist, c.lbl, ym) : UNCATEGORIZED.lbl; };
  const subName = (s, ym) => histName(s.hist, s.name, ym);

  const fmtD = d =>
    d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');

  const esc = s =>
    s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  /* ── 待拆帳工具函式 ── */
  const unsplitRemaining = r => r.amt;  // 拆帳後直接扣減 amt，不再使用 splits 陣列
  const isUnsplitDone = r => r.cat === UNSPLIT_KEY && r.amt <= 0;
  // 取得目前所有「待拆帳」紀錄中尚未分配完的總金額（跨全部歷史，不限本月）
  const totalUnsplitRemaining = () =>
    recs.filter(r => r.cat === UNSPLIT_KEY && !r.deleted)
        .reduce((s, r) => s + unsplitRemaining(r), 0);

  /* ── 分類按鈕渲染（動態建立可捲動清單） ── */
  function renderCatBtns() {
    const col = document.getElementById('kbCatCol');
    if (!col) return;
    col.innerHTML = CKEYS.map(k => {
      const c = CATS[k];
      const isOn = k === cat;
      return `<button class="cbt${isOn ? ' on' : ''}${isOn && catSub !== null ? ' has-sub' : ''}" data-c="${k}" id="cbt-${k}">${c.icon}</button>`;
    }).join('') + `<button class="kb-catcol-addbtn" id="kbCatAddBtn" title="新增分類">＋</button>`;
    const addBtn = document.getElementById('kbCatAddBtn');
    if (addBtn) addBtn.onclick = () => { addNewCategory(); };
  }

  /* ── 分類清單操作 ── */
  const findCat = key => CATS_LIST.find(c => c.key === key);

  function addNewCategory() {
    const key = newCatKey();
    CATS_LIST.push({ key, icon: '🏷️', lbl: '新分類' });
    rebuildCats();
    initBdgPlan();
    saveCats();
    saveBdgPlan();
    renderCatBtns();
    render();
    setTimeout(() => openRename(key), 80);
    return key;
  }

  function deleteCategory(key) {
    if (CATS_LIST.length <= 1) { toast('至少要保留一個分類'); return; }
    const c = findCat(key);
    if (!c) return;
    // 找出歸屬於此分類的所有記錄（跨全部月份）
    const affected = recs.filter(r => {
      if (r.deleted || r.cat === UNSPLIT_KEY) return false;
      const ref = effBdgRef(r);
      return (ref && ref.catKey === key) || r.cat === key;
    });
    const ok = confirm(`刪除分類「${c.lbl}」？\n` + (affected.length > 0
      ? `此分類下有 ${affected.length} 筆記錄，刪除後它們將不再計入預算。`
      : '此分類下沒有記錄。'));
    if (!ok) return;
    if (affected.length > 0) {
      const toUnsplit = confirm(`要把這 ${affected.length} 筆記錄改列為「待拆帳」，之後再逐筆重新分配到其他分類嗎？\n\n確定 = 改列待拆帳（之後仍會計入預算）\n取消 = 保持「未分類」（不計入預算）`);
      if (toUnsplit) {
        const now = Date.now();
        affected.forEach(r => {
          r.cat = UNSPLIT_KEY;
          delete r.bdgRef;
          r.updatedAt = now;
          fbSyncRec(r);
        });
        save();
      }
    }
    CATS_LIST = CATS_LIST.filter(x => x.key !== key);
    delete bdgPlan[key];
    rebuildCats();
    if (cat === key) { cat = CKEYS[0]; catSub = null; } // 若刪除的正是目前選取的分類，重置為第一個分類
    saveCats();
    saveBdgPlan();
    renderCatBtns();
    closeRename();
    render();
    toast('已刪除：' + c.lbl);
  }

  let catSub = null; // 目前選取的子分類 id（null = 不指定）

  // 同步分類按鈕狀態（選取框 + 已選子分類的小圓點）
  function syncCatBtns() {

  function pickCatSub(catKey, subId) {

  function setupLongPress() {
    const grid = document.getElementById('kbGrid');
    let pressTimer     = null;
    let pressedBtn     = null;
    let longPressFired = false;
    let usingTouch     = false; // 偵測到 touch 事件後，忽略後續合成的 mouse 事件，避免重複觸發
    let startX = 0, startY = 0;
    const MOVE_THRESHOLD = 10; // px
    const LONG_MS = 350;

    // ── 子分類彈出面板 ──
    let pop = null;        // 面板 DOM
    let popCat = null;     // 面板所屬分類 key
    let hoverEl = null;    // 目前手指所在的子分類項目

    const closePop = () => {
      if (pop) pop.remove();
      pop = null; popCat = null; hoverEl = null;
      const col = document.getElementById('kbCatCol');
      if (col) col.style.overflowY = '';
    };

    const openPop = (btn) => {
      const key  = btn.dataset.c;
      const plan = bdgPlan[key];
      const subs = (plan && plan.subs) || [];
      if (!subs.length) {
        toast('「' + CATS[key].lbl + '」還沒有子分類，可到預算頁新增');
        return false;
      }
      const ym = curYM();
      pop = document.createElement('div');
      pop.className = 'sub-pop';
      pop.style.setProperty('--cols', subs.length > 6 ? 2 : 1);
      pop.innerHTML =
        `<div class="sub-pop-head">${CATS[key].icon} ${esc(CATS[key].lbl)}</div>` +
        `<div class="sub-pop-list">` +
        subs.map(x => `<div class="sub-pop-item${(cat === key && catSub === x.id) ? ' cur' : ''}" data-sid="${x.id}">${esc(subName(x, ym))}</div>`).join('') +
        `</div>`;
      document.body.appendChild(pop);
      popCat = key;

      // 定位：貼在分類按鈕左側，垂直置中於按鈕，並限制在畫面內
      const r  = btn.getBoundingClientRect();
      const pw = pop.offsetWidth, ph = pop.offsetHeight;
      let left = r.left - pw - 8;
      if (left < 8) left = 8;
      let top = r.top + r.height / 2 - ph / 2;
      top = Math.max(8, Math.min(top, window.innerHeight - ph - 8));
      pop.style.left = left + 'px';
      pop.style.top  = top + 'px';

      // 滑動期間鎖住分類欄捲動
      const col = document.getElementById('kbCatCol');
      if (col) col.style.overflowY = 'hidden';
      return true;
    };

    const updateHover = (x, y) => {
      if (!pop) return;
      const el = document.elementFromPoint(x, y);
      const item = el && el.closest ? el.closest('.sub-pop-item') : null;
      const next = (item && pop.contains(item)) ? item : null;
      if (next === hoverEl) return;
      if (hoverEl) hoverEl.classList.remove('hover');
      hoverEl = next;
      if (hoverEl) {
        hoverEl.classList.add('hover');
        try { navigator.vibrate && navigator.vibrate(8); } catch(e) {}
      }
    };

    const clearPressTimer = () => {
      clearTimeout(pressTimer);
      pressTimer = null;
    };

    // 手指放開 / 滑鼠放開：若停在某子分類上 → 選取；否則取消
    const endPress = (commit) => {
      if (pressedBtn) pressedBtn.classList.remove('pressed');
      pressedBtn = null;
      clearPressTimer();
      if (pop) {
        if (commit) pickCatSub(popCat, hoverEl ? parseInt(hoverEl.dataset.sid, 10) : null); // 停在子分類上 → 選子分類；面板外 → 只選大分類
        closePop();
      }
    };

    const startPress = (btn) => {
      longPressFired = false;
      pressedBtn = btn;
      btn.classList.add('pressed');
      clearPressTimer();
      pressTimer = setTimeout(() => {
        pressTimer = null;
        longPressFired = true;       // 不論有沒有子分類，長按結束後都不要當成「點擊選取」
        if (pressedBtn) pressedBtn.classList.remove('pressed');
        try { navigator.vibrate && navigator.vibrate(15); } catch(e) {}
        openPop(btn);
      }, LONG_MS);
    };

    // 長按觸發前移動太多 → 視為捲動，取消長按
    const movePress = (clientX, clientY) => {
      if (pop) { updateHover(clientX, clientY); return; }
      if (!pressTimer) return;
      if (Math.abs(clientX - startX) > MOVE_THRESHOLD || Math.abs(clientY - startY) > MOVE_THRESHOLD) {
        endPress(false);
      }
    };

    // Touch
    grid.addEventListener('touchstart', e => {
      const btn = e.target.closest('.cbt');
      if (!btn) return;
      usingTouch = true;
      const t = e.touches[0];
      startX = t.clientX;
      startY = t.clientY;
      startPress(btn);
    }, { passive: true });

    // 非 passive：面板開啟後要擋掉捲動，手指才能順利滑到子分類
    grid.addEventListener('touchmove', e => {
      const t = e.touches[0];
      if (pop && e.cancelable) e.preventDefault();
      movePress(t.clientX, t.clientY);
    }, { passive: false });

    grid.addEventListener('touchend',    () => { endPress(true);  setTimeout(() => { usingTouch = false; }, 500); }, { passive: true });
    grid.addEventListener('touchcancel', () => { endPress(false); setTimeout(() => { usingTouch = false; }, 500); }, { passive: true });

    // Mouse（桌機；若裝置剛觸發過 touch，忽略合成滑鼠事件避免重複）
    grid.addEventListener('mousedown', e => {
      if (usingTouch) return;
      const btn = e.target.closest('.cbt');
      if (!btn) return;
      startX = e.clientX;
      startY = e.clientY;
      startPress(btn);
    });
    document.addEventListener('mousemove', e => {
      if (usingTouch) return;
      if (pop || pressTimer) movePress(e.clientX, e.clientY);
    });
    document.addEventListener('mouseup', () => { if (!usingTouch && (pop || pressedBtn)) endPress(true); });

    // 長按時不要跳出系統右鍵 / 長按選單
    grid.addEventListener('contextmenu', e => { if (e.target.closest('.cbt')) e.preventDefault(); });

    // 點擊 → 選取分類（原生 click 會正確區分點擊與捲動）
    grid.addEventListener('click', e => {
      const btn = e.target.closest('.cbt');
      if (!btn) return;
      if (longPressFired) { longPressFired = false; return; } // 長按結束觸發的 click，不當作選取
      sc(btn.dataset.c);
    });

  }

  /* ── 預算頁：長按大分類標題 → 開啟「編輯分類」視窗（和記帳區的分類按鈕一樣） ── */
  function setupBdgHeadLongPress() {
    const panel = document.getElementById('bdgPlanPanel');
    if (!panel) return;
    let timer = null, fired = false, usingTouch = false, sx = 0, sy = 0;
    const clear = () => { clearTimeout(timer); timer = null; };
    const start = (e, x, y) => {
      const head = e.target.closest('.bdgp-item-head');
      if (!head || !head.dataset.cat) return;
      fired = false; sx = x; sy = y; clear();
      timer = setTimeout(() => {
        timer = null; fired = true;
        try { if (navigator.vibrate) navigator.vibrate(15); } catch (_) {}
        openRename(head.dataset.cat);
      }, 480);
    };
    const move = (x, y) => { if (timer && (Math.abs(x - sx) > 10 || Math.abs(y - sy) > 10)) clear(); };
    const end = () => { clear(); setTimeout(() => { fired = false; }, 400); };

    panel.addEventListener('touchstart', e => { usingTouch = true; const t = e.touches[0]; start(e, t.clientX, t.clientY); }, { passive: true });
    panel.addEventListener('touchmove',  e => { const t = e.touches[0]; move(t.clientX, t.clientY); }, { passive: true });
    panel.addEventListener('touchend',    () => { end(); setTimeout(() => { usingTouch = false; }, 500); }, { passive: true });
    panel.addEventListener('touchcancel', () => { end(); setTimeout(() => { usingTouch = false; }, 500); }, { passive: true });
    panel.addEventListener('mousedown', e => { if (usingTouch) return; start(e, e.clientX, e.clientY); });
    panel.addEventListener('mousemove', e => { if (!usingTouch) move(e.clientX, e.clientY); });
    panel.addEventListener('mouseup',    () => { if (!usingTouch) end(); });
    panel.addEventListener('mouseleave', () => { if (!usingTouch) clear(); });
    // 長按結束後瀏覽器仍會補發 click（會誤觸展開/收合）→ 在捕獲階段吃掉
    panel.addEventListener('click', e => {
      if (fired || Date.now() - _catDragEndAt < 400) { fired = false; e.stopPropagation(); e.preventDefault(); }
    }, true);
    panel.addEventListener('contextmenu', e => { if (e.target.closest('.bdgp-item-head')) e.preventDefault(); });
  }

  /* 結構: bdgPlan[catKey] = { budget, subs:[{id,name,budget}], open } */
  const SK_BDGPLAN = 'kakeibo_bdgplan';
  let bdgPlan = {}; // keyed by catKey
  let _subId  = 100;

  function initBdgPlan() {
    CKEYS.forEach(k => {
      if (!bdgPlan[k]) bdgPlan[k] = { budget: 0, subs: [], open: false };
    });
  }

  const saveBdgPlan = () => {
    const v = JSON.stringify(bdgPlan);
    idbSet(SK_BDGPLAN, v).catch(() => {});
    try { localStorage.setItem(SK_BDGPLAN, v); } catch(e) {}
    fbSyncMeta(SK_BDGPLAN, v);
  };

  /* ── 預算規劃渲染 ── */
  /* 取得一筆記錄「實際歸屬」的預算位置：
     1) 有明確關聯（bdgRef）且大分類仍存在 → 用 bdgRef（可能含細項 subId）
     2) 否則退回記帳時選的大分類 r.cat（只選大項目、沒選細項的情況）
     3) 待拆帳 / 分類已刪除 → null（不計入）                                  */
  function effBdgRef(r) {
    if (!r || r.cat === UNSPLIT_KEY) return null;
    if (r.bdgRef && r.bdgRef.catKey && CKEYS.includes(r.bdgRef.catKey)) {
      return { catKey: r.bdgRef.catKey, subId: r.bdgRef.subId };
    }
    if (r.cat && CKEYS.includes(r.cat)) return { catKey: r.cat, subId: undefined };
    return null;
  }

  function getBdgSpending() {
    const mrs = getMrs();
    const out = {};
    mrs.forEach(r => {
      if (r.exempt || r.deleted) return; // 排除 exempt 和 deleted
      const ref = effBdgRef(r);
      if (!ref) return;
      const ck = ref.catKey;
      out[ck] = (out[ck] || 0) + r.amt;
      if (ref.subId !== undefined) {
        const sk = ck + ':' + ref.subId;
        out[sk] = (out[sk] || 0) + r.amt;
      }
    });
    return out;
  }

  /* ── 預算按月份保存 ──
     bdgPlan._hist = { 'YYYY-MM': { <subId 或 'cat:<catKey>'>: 金額 } }
     某月的預算 = 「不晚於該月」最近一次的設定；都沒有就用原本的基準值（s.budget / plan.own）。
     所以在 10 月修改預算，只會影響 10 月以後，不會改動過去月份的達成率。            */
  const curYM = () => vy + '-' + String(vm + 1).padStart(2, '0');

  function histLookup(key, ym, base) {
    const h = bdgPlan._hist || {};
    let best = null;
    Object.keys(h).forEach(m => {
      if (m <= ym && h[m] && h[m][key] !== undefined && (best === null || m > best)) best = m;
    });
    return best !== null ? h[best][key] : base;
  }
  function setHist(ym, key, v) {
    const h = bdgPlan._hist || (bdgPlan._hist = {});
    (h[ym] = h[ym] || {})[key] = v;
  }
  const subBudgetAt = (s, ym) => histLookup(s.id, ym, s.budget || 0);
  function catBudgetAt(k, ym) {
    const plan = bdgPlan[k];
    if (!plan) return 0;
    if (plan.subs.length > 0) return plan.subs.reduce((a, s) => a + subBudgetAt(s, ym), 0);
    return histLookup('cat:' + k, ym, plan.own || 0);
  }

  /* ── 超支結轉 ──
     某個預算單位（沒細項的大分類，或有細項分類底下的「每個細項」）上個月若超支（剩餘為負），
     這個負數會從本月預算扣掉；若本月又超支就繼續往下個月帶，沒超支（或沒設預算）就歸零。
     有細項的分類：各細項各自結轉，大分類預算 = 細項（含結轉）加總；「未指定細項」的花費不結轉。
     只有結轉起始月（預設 2026-10，可用 bdgPlan._meta.carryFrom 覆寫）之後才會結轉。 */
  const CARRY_START_DEFAULT = '2026-10';
  const nextYM = ym => { let [y, m] = ym.split('-').map(Number); m++; if (m > 12) { m = 1; y++; } return y + '-' + String(m).padStart(2, '0'); };

  function monthlySpendMap() {
    const out = {};
    recs.forEach(r => {
      if (r.deleted || r.exempt) return;
      const ref = effBdgRef(r);
      if (!ref) return;
      const ym = (r.date || '').slice(0, 7);
      if (ym.length < 7) return;
      const m = out[ym] || (out[ym] = {});
      m[ref.catKey] = (m[ref.catKey] || 0) + r.amt;
      if (ref.subId !== undefined) { const sk = ref.catKey + ':' + ref.subId; m[sk] = (m[sk] || 0) + r.amt; }
    });
    return out;
  }

  // 回傳「帶進 ym 月」的結轉：{ catKey 或 'catKey:subId': 負數 }
  function getCarry(ym) {
    const start = (bdgPlan._meta && bdgPlan._meta.carryFrom) || CARRY_START_DEFAULT;
    if (!(ym > start)) return {};
    const spend = monthlySpendMap();
    let carry = {}, m = start, guard = 0;
    while (m < ym && guard++ < 240) {
      const sp = spend[m] || {}, next = {};
      CKEYS.forEach(k => {
        const plan = bdgPlan[k];
        if (!plan) return;
        const units = plan.subs.length > 0
          ? plan.subs.map(s => ({ id: k + ':' + s.id, base: subBudgetAt(s, m) }))
          : [{ id: k, base: catBudgetAt(k, m) }];
        units.forEach(u => {
          if (u.base <= 0) return;                       // 當月沒設預算 → 不結轉
          const rem = u.base + (carry[u.id] || 0) - (sp[u.id] || 0);
          if (rem < 0) next[u.id] = rem;
        });
      });
      carry = next;
      m = nextYM(m);
    }
    return carry;
  }
  const subBudgetEff = (k, s, ym, carry) => { const b = subBudgetAt(s, ym); return b > 0 ? b + (carry[k + ':' + s.id] || 0) : 0; };
  function catBudgetEff(k, ym, carry) {
    const plan = bdgPlan[k];
    if (!plan) return 0;
    if (plan.subs.length > 0) return plan.subs.reduce((a, s) => a + subBudgetEff(k, s, ym, carry), 0);
    const b = catBudgetAt(k, ym);
    return b > 0 ? b + (carry[k] || 0) : 0;
  }
  const fmtMoney = n => (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString();

  // 編輯預算後延後重繪：輸入框還有焦點就先不畫（避免焦點丟失），失焦後再補畫
  let _bdgDirty = false, _bdgRefreshTimer = null;
  function scheduleBdgRefresh() {
    _bdgDirty = true;
    clearTimeout(_bdgRefreshTimer);
    _bdgRefreshTimer = setTimeout(() => {
      const a = document.activeElement;
      if (a && a.tagName === 'INPUT') return;          // 仍在輸入 → 保持 dirty，等 focusout
      if (ctab !== 'list' && ctab !== 'ana') renderBdgPlan();
    }, 200);
  }
  document.addEventListener('focusout', () => { if (_bdgDirty) scheduleBdgRefresh(); });

  function renderBdgPlan() {
    const panel = document.getElementById('bdgPlanPanel');
    if (!panel) return;
    _bdgDirty = false;
    const sp = getBdgSpending();
    const ym = curYM();

    // 大分類預算：有細項 = 細項加總；沒有細項 = 直接設定的金額（皆依月份），再扣掉上月結轉的超支
    const carry = getCarry(ym);
    const cbEff = {}, cbBase = {};
    let totalBudget = 0, totalSpent = 0, totalBase = 0;
    CKEYS.forEach(k => {
      cbBase[k] = catBudgetAt(k, ym);
      cbEff[k]  = catBudgetEff(k, ym, carry);
      totalBase   += cbBase[k];
      totalBudget += cbEff[k];
      totalSpent  += sp[k] || 0;
    });
    const rem = totalBudget - totalSpent;

    const summaryHtml = `<div class="bdgp-summary">
      <div class="bdgp-sum-col">
        <div class="bdgp-sum-label">本月總預算</div>
        <div class="bdgp-sum-val">${totalBase > 0 ? fmtMoney(totalBudget) : '—'}</div>
      </div>
      <div class="bdgp-sum-div"></div>
      <div class="bdgp-sum-col">
        <div class="bdgp-sum-label">已使用</div>
        <div class="bdgp-sum-val${totalBase>0&&totalSpent>totalBudget?' over':''}">$${totalSpent.toLocaleString()}</div>
      </div>
      <div class="bdgp-sum-div"></div>
      <div class="bdgp-sum-col">
        <div class="bdgp-sum-label">剩餘</div>
        <div class="bdgp-sum-val${totalBase>0&&rem<0?' over':''}">${totalBase > 0 ? fmtMoney(rem) : '—'}</div>
      </div>
    </div>`;

    let itemsHtml = '';
    CKEYS.forEach(k => {
      const c    = CATS[k];
      const plan = bdgPlan[k];
      const spent = sp[k] || 0;
      const hasBud = cbBase[k] > 0, ebud = cbEff[k];
      const pct   = hasBud ? (ebud > 0 ? Math.min(100, Math.round(spent / ebud * 100)) : 100) : 0;
      const isOver = hasBud && spent > ebud;

      // 細分類列（每個可直接編輯預算）
      let subsHtml = '';
      plan.subs.forEach(s => {
        const ss    = sp[k + ':' + s.id] || 0;
        const sbase = subBudgetAt(s, ym);
        const scar  = sbase > 0 ? (carry[k + ':' + s.id] || 0) : 0;
        const sbud  = sbase > 0 ? sbase + scar : 0;
        const spct  = sbase > 0 ? (sbud > 0 ? Math.min(100, Math.round(ss / sbud * 100)) : 100) : 0;
        const sOver = sbase > 0 && ss > sbud;
        subsHtml += `<div class="bdgp-sub-item" data-cat="${k}" data-sid="${s.id}">
          <span class="bdgp-sub-dot" title="按住拖動排序，雙擊刪除"></span>
          <div class="bdgp-sub-main">
            <div class="bdgp-sub-top-row">
              <input
                class="bdgp-sub-name-inp"
                type="text"
                value="${esc(subName(s, ym))}"
                maxlength="12"
                onchange="renameBdgSub('${k}',${s.id},this.value)"
                onclick="event.stopPropagation()"
              >
              <div class="bdgp-sub-right">
                <span class="bdgp-sub-spent${sOver?' over':''}">$${ss.toLocaleString()}</span>
                <span class="bdgp-sub-sep">/</span>
                <span class="bdgp-sub-budget-wrap">NT$<input
                  class="bdgp-sub-bdg-inp"
                  type="number" min="0"
                  value="${sbase || ''}"
                  placeholder="預算"
                  onchange="setBdgSubBudget('${k}',${s.id},this.value)"
                  onclick="event.stopPropagation()"
                ></span>
              </div>
            </div>
            ${scar < 0 ? `<div class="bdgp-carry">↳ 上月超支 ${fmtMoney(scar)} 已從本月預算扣除</div>` : ''}
            ${sbase > 0 ? `<div class="bdgp-sub-bar-bg"><div class="bdgp-sub-bar-fill${sOver?' over':''}" style="width:${spct}%"></div></div>` : ''}
          </div>
        </div>`;
      });

      // 只選大項目、沒選細項的支出：已計入大項目總額，這裡列出讓加總對得起來
      if (plan.subs.length > 0) {
        const noSub = spent - plan.subs.reduce((a, s) => a + (sp[k + ':' + s.id] || 0), 0);
        if (noSub > 0) {
          subsHtml += `<div class="ana-sub-row"><span class="ana-sub-dot"></span>
            <span class="ana-sub-name">未指定細項</span>
            <span class="ana-sub-spent">$${noSub.toLocaleString()}</span></div>`;
        }
      }

      itemsHtml += `<div class="bdgp-item" data-cat="${k}">
        <div class="bdgp-item-head" data-cat="${k}" onclick="toggleBdgItem('${k}')" style="cursor:pointer" title="長按編輯分類">
          <span class="bdgp-icon">${c.icon}</span>
          <span class="bdgp-name">${esc(catLbl(k, ym))}</span>
          <span class="bdgp-total${isOver?' over':''}">$${spent.toLocaleString()}</span>
          <span class="bdgp-budget-tag" style="margin-left:-7px">/ ${hasBud ? fmtMoney(ebud) : '未設預算'}</span>
          <span class="bdgp-grip" title="按住拖動排序"></span>
        </div>
        ${hasBud ? `<div class="bdgp-bar-wrap"><div class="bdgp-bar-bg"><div class="bdgp-bar-fill${isOver?' over':''}" style="width:${pct}%"></div></div></div>` : ''}
        <div class="bdgp-body${plan.open?' open':''}">
          ${plan.subs.length === 0 ? `<div class="bdgp-budget-row">
            <span class="bdgp-budget-label">大項目預算</span>
            <input class="bdgp-budget-inp" type="number" min="0" placeholder="直接輸入預算（或在下方新增細項）"
              value="${cbBase[k] || ''}" onclick="event.stopPropagation()"
              onchange="setBdgBudget('${k}',this.value)">
          </div>${hasBud && (carry[k] || 0) < 0 ? `<div class="bdgp-carry" style="padding:0 14px 6px">↳ 上月超支 ${fmtMoney(carry[k])} 已從本月預算扣除</div>` : ''}` : ''}
          <div class="bdgp-sub-list">${subsHtml}</div>
          <div class="bdgp-add-row">
            <input class="bdgp-add-inp" id="bdgp-si-${k}" type="text" placeholder="細分類名稱" maxlength="12"
              onclick="event.stopPropagation()">
            <input class="bdgp-add-num" id="bdgp-sb-${k}" type="number" placeholder="預算"  min="0"
              onclick="event.stopPropagation()">
            <button class="bdgp-add-btn" onclick="event.stopPropagation();addBdgSub('${k}')">＋</button>
          </div>
        </div>
      </div>`;
    });

    panel.innerHTML = `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 4px 6px">
      <span style="font-size:10px;font-weight:700;color:var(--muted);letter-spacing:1.2px">預算規劃</span>
    </div>${summaryHtml}${itemsHtml}`;

    setupSubDotHandlers(panel);
    setupCatGripHandlers(panel);
  }

  function renameBdgSub(k, sid, val) {
    const plan = bdgPlan[k];
    if (!plan) return;
    const s = plan.subs.find(x => x.id === sid);
    if (!s || !val.trim() || s.name === val.trim()) return;
    pushNameHist(s, 'name', val.trim());   // 只從本月起換新名稱，過去月份保留舊名
    saveBdgPlan();
  }

  function setBdgSubBudget(k, sid, val) {
    const plan = bdgPlan[k];
    if (!plan) return;
    const s = plan.subs.find(x => x.id === sid);
    if (!s) return;
    const ym = curYM();
    const v  = Math.max(0, parseInt(val, 10) || 0);
    if (v === subBudgetAt(s, ym)) return;   // 沒變就不存檔、不同步
    setHist(ym, s.id, v);                   // 只影響本月起，不改動過去月份
    saveBdgPlan();
    scheduleBdgRefresh();                   // 總覽／進度條稍後自動更新
  }

  function toggleBdgItem(k) {
    bdgPlan[k].open = !bdgPlan[k].open;
    saveBdgPlan();
    renderBdgPlan();
  }

  // 沒有細項的大分類：直接設定該分類的預算（有細項時預算 = 細項加總，不可直接設）
  function setBdgBudget(k, val) {
    const plan = bdgPlan[k];
    if (!plan || plan.subs.length > 0) return;
    const ym = curYM();
    const v  = Math.max(0, parseInt(val, 10) || 0);
    if (v === catBudgetAt(k, ym)) return;
    setHist(ym, 'cat:' + k, v);
    saveBdgPlan();
    scheduleBdgRefresh();
  }

  function addBdgSub(k) {
    const nameEl = document.getElementById('bdgp-si-' + k);
    const budEl  = document.getElementById('bdgp-sb-' + k);
    const name   = nameEl ? nameEl.value.trim() : '';
    if (!name) { toast('請輸入細分類名稱'); return; }
    const budget = parseInt(budEl ? budEl.value : '0', 10) || 0;
    const newId = _subId++;
    bdgPlan[k].subs.push({ id: newId, name, budget: 0 });
    if (budget > 0) setHist(curYM(), newId, budget); // 新細項的預算從本月起算
    saveBdgPlan();
    renderBdgPlan();
    toast('已新增：' + name);
  }

  function delBdgSub(k, sid) {
    bdgPlan[k].subs = bdgPlan[k].subs.filter(s => s.id !== sid);
    // 將有此細分類關聯的支出改為只關聯父項，並同步更新時間戳記和 Firebase
    const now = Date.now();
    recs.forEach(r => {
      if (r.bdgRef && r.bdgRef.catKey === k && r.bdgRef.subId === sid) {
        delete r.bdgRef.subId;
        r.updatedAt = now;
        fbSyncRec(r);
      }
    });
    save();
    saveBdgPlan();
    renderBdgPlan();
  }

  function confirmDelBdgSub(k, sid) {
    const plan = bdgPlan[k];
    const s = plan && plan.subs.find(x => x.id === sid);
    const name = s ? s.name : '此細項';
    const ok = confirm(`刪除細項「${name}」？\n相關記錄會保留，但不再關聯此細項。`);
    if (ok) delBdgSub(k, sid);
  }

  /* ── 細項點點：長按拖動排序 / 雙擊刪除 ── */
  const DOT_LONGPRESS_MS = 280;
  const DOT_DRAG_MOVE_TOLERANCE = 6; // px，超過視為移動而非點擊
  const DOT_DBLTAP_MS = 320;

  let _subDrag = null;     // { k, sid, itemEl, listEl, startY, lastY, placeholder }
  let _lastDotTap = null;  // { sid, t }

  function setupSubDotHandlers(panel) {
    panel.querySelectorAll('.bdgp-sub-dot').forEach(dot => {
      // 避免重複綁定
      if (dot._bound) return;
      dot._bound = true;

      let pressTimer = null;
      let startX = 0, startY = 0;
      let longPressFired = false;

      const itemEl = () => dot.closest('.bdgp-sub-item');

      const clearPressTimer = () => {
        if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
      };

      dot.addEventListener('touchstart', e => {
        const item = itemEl();
        if (!item) return;
        const t = e.touches[0];
        startX = t.clientX; startY = t.clientY;
        longPressFired = false;

        pressTimer = setTimeout(() => {
          longPressFired = true;
          startSubDrag(item, t.clientY);
        }, DOT_LONGPRESS_MS);
      }, { passive: true });

      dot.addEventListener('touchmove', e => {
        const t = e.touches[0];
        if (_subDrag) {
          e.preventDefault();
          moveSubDrag(t.clientY);
          return;
        }
        // 還沒進入拖曳狀態時，如果手指移動超過容許範圍，視為非長按（取消，避免誤觸）
        if (Math.abs(t.clientX - startX) > DOT_DRAG_MOVE_TOLERANCE ||
            Math.abs(t.clientY - startY) > DOT_DRAG_MOVE_TOLERANCE) {
          clearPressTimer();
        }
      }, { passive: false });

      dot.addEventListener('touchend', e => {
        clearPressTimer();
        if (_subDrag) {
          endSubDrag();
          return;
        }
        if (longPressFired) return; // 長按已處理過，不要再判定為點擊

        // 雙擊判斷
        const item = itemEl();
        if (!item) return;
        const sid = +item.dataset.sid;
        const k   = item.dataset.cat;
        const now = Date.now();
        if (_lastDotTap && _lastDotTap.sid === sid && (now - _lastDotTap.t) < DOT_DBLTAP_MS) {
          _lastDotTap = null;
          confirmDelBdgSub(k, sid);
        } else {
          _lastDotTap = { sid, t: now };
        }
      }, { passive: true });

      dot.addEventListener('touchcancel', () => {
        clearPressTimer();
        if (_subDrag) endSubDrag(true);
      }, { passive: true });

      // 桌機滑鼠：按住拖動排序
      dot.addEventListener('mousedown', e => {
        if (e.button !== 0) return;
        const item = itemEl(); if (!item) return;
        const y0 = e.clientY;
        clearPressTimer();
        pressTimer = setTimeout(() => { pressTimer = null; longPressFired = true; startSubDrag(item, y0); }, DOT_LONGPRESS_MS);
        const mv = ev => { if (_subDrag) moveSubDrag(ev.clientY); };
        const up = () => {
          clearPressTimer();
          document.removeEventListener('mousemove', mv);
          document.removeEventListener('mouseup', up);
          if (_subDrag) endSubDrag();
        };
        document.addEventListener('mousemove', mv);
        document.addEventListener('mouseup', up);
      });

      // 桌面滑鼠雙擊（方便電腦上測試/使用）
      dot.addEventListener('dblclick', e => {
        e.preventDefault();
        const item = itemEl();
        if (!item) return;
        confirmDelBdgSub(item.dataset.cat, +item.dataset.sid);
      });
    });
  }

  /* ── 大分類拖曳排序：按住右側把手 → 其他分類收起 → 拖到定位 → 存回 CATS_LIST（記帳區圖示順序同步） ── */
  let _catDrag = null;
  let _catDragEndAt = 0;

  function setupCatGripHandlers(panel) {
    panel.querySelectorAll('.bdgp-grip').forEach(grip => {
      let timer = null, sx = 0, sy = 0;
      const itemEl = () => grip.closest('.bdgp-item');
      const clear = () => { clearTimeout(timer); timer = null; };
      const begin = (y) => { const it = itemEl(); if (it) startCatDrag(it, y); };

      grip.addEventListener('touchstart', e => {
        e.stopPropagation();                    // 不要觸發「長按標題 → 編輯分類」和左右滑動分頁
        const t = e.touches[0]; sx = t.clientX; sy = t.clientY;
        clear();
        timer = setTimeout(() => { timer = null; begin(sy); }, DOT_LONGPRESS_MS);
      }, { passive: true });
      grip.addEventListener('touchmove', e => {
        const t = e.touches[0];
        if (_catDrag) { e.preventDefault(); moveCatDrag(t.clientY); return; }
        if (Math.abs(t.clientX - sx) > DOT_DRAG_MOVE_TOLERANCE || Math.abs(t.clientY - sy) > DOT_DRAG_MOVE_TOLERANCE) clear();
      }, { passive: false });
      const endTouch = cancelled => { clear(); if (_catDrag) endCatDrag(cancelled); };
      grip.addEventListener('touchend',    () => endTouch(false), { passive: true });
      grip.addEventListener('touchcancel', () => endTouch(true),  { passive: true });

      // 桌機滑鼠
      grip.addEventListener('mousedown', e => {
        if (e.button !== 0) return;
        e.stopPropagation();
        sy = e.clientY; clear();
        timer = setTimeout(() => { timer = null; begin(sy); }, DOT_LONGPRESS_MS);
        const mv = ev => { if (_catDrag) moveCatDrag(ev.clientY); };
        const up = () => {
          clear();
          document.removeEventListener('mousemove', mv);
          document.removeEventListener('mouseup', up);
          if (_catDrag) endCatDrag(false);
        };
        document.addEventListener('mousemove', mv);
        document.addEventListener('mouseup', up);
      });
    });
  }

  function startCatDrag(itemEl, clientY) {
    const panel = document.getElementById('bdgPlanPanel');
    if (!panel) return;
    panel.classList.add('sorting');             // 先收起所有分類，清單變短比較好拖
    const rect = itemEl.getBoundingClientRect(); // 收起後再量位置
    const placeholder = document.createElement('div');
    placeholder.className = 'bdgp-item-placeholder';
    placeholder.style.height = rect.height + 'px';
    itemEl.after(placeholder);

    itemEl.classList.add('dragging');
    itemEl.style.position = 'fixed';
    itemEl.style.left = rect.left + 'px';
    itemEl.style.top = rect.top + 'px';
    itemEl.style.width = rect.width + 'px';
    itemEl.style.zIndex = '999';
    document.body.appendChild(itemEl);

    _catDrag = { itemEl, placeholder, panel, offsetY: rect.height / 2 };
    moveCatDrag(clientY);
    if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
  }

  function moveCatDrag(clientY) {
    if (!_catDrag) return;
    const { itemEl, placeholder, panel, offsetY } = _catDrag;
    const top = clientY - offsetY;
    itemEl.style.top = top + 'px';
    const center = top + itemEl.getBoundingClientRect().height / 2;
    let target = null;
    for (const sib of panel.querySelectorAll(':scope > .bdgp-item')) {
      const r = sib.getBoundingClientRect();
      if (center < r.top + r.height / 2) { target = sib; break; }
    }
    if (target) { if (target.previousElementSibling !== placeholder) panel.insertBefore(placeholder, target); }
    else if (panel.lastElementChild !== placeholder) panel.appendChild(placeholder);
  }

  function endCatDrag(cancelled) {
    if (!_catDrag) return;
    const { itemEl, placeholder, panel } = _catDrag;
    _catDrag = null;
    _catDragEndAt = Date.now();
    itemEl.classList.remove('dragging');
    ['position', 'left', 'top', 'width', 'zIndex'].forEach(p => { itemEl.style[p] = ''; });
    placeholder.replaceWith(itemEl);
    panel.classList.remove('sorting');
    if (!cancelled) {
      const order = [...panel.querySelectorAll(':scope > .bdgp-item')].map(el => el.dataset.cat);
      const byKey = new Map(CATS_LIST.map(c => [c.key, c]));
      const next = order.map(k => byKey.get(k)).filter(Boolean);
      CATS_LIST.forEach(c => { if (!next.includes(c)) next.push(c); });   // 防止遺漏
      if (next.some((c, i) => c !== CATS_LIST[i])) {
        CATS_LIST = next;
        rebuildCats();
        saveCats();
        renderCatBtns();                         // 記帳區右側圖示順序同步
      }
    }
    renderBdgPlan();
  }

  function startSubDrag(itemEl, clientY) {
    const listEl = itemEl.closest('.bdgp-sub-list');
    if (!listEl) return;
    const k   = itemEl.dataset.cat;
    const sid = +itemEl.dataset.sid;

    const rect = itemEl.getBoundingClientRect();
    const placeholder = document.createElement('div');
    placeholder.className = 'bdgp-sub-placeholder';
    placeholder.style.height = rect.height + 'px';
    itemEl.after(placeholder);

    itemEl.classList.add('dragging');
    itemEl.style.position = 'fixed';
    itemEl.style.left = rect.left + 'px';
    itemEl.style.top = rect.top + 'px';
    itemEl.style.width = rect.width + 'px';
    itemEl.style.zIndex = '999';

    document.body.appendChild(itemEl);

    _subDrag = { k, sid, itemEl, listEl, placeholder, offsetY: clientY - rect.top, lastTop: rect.top };

    if (navigator.vibrate) { try { navigator.vibrate(12); } catch(e){} }
  }

  function moveSubDrag(clientY) {
    if (!_subDrag) return;
    const { itemEl, placeholder, listEl, offsetY } = _subDrag;
    const top = clientY - offsetY;
    itemEl.style.top = top + 'px';
    _subDrag.lastTop = top;

    // 找出目前位置應插入的位置：比較與其他 sub-item 中心點的關係
    const siblings = [...listEl.querySelectorAll('.bdgp-sub-item:not(.dragging)')];
    const itemCenter = top + itemEl.getBoundingClientRect().height / 2;

    let target = null;
    for (const sib of siblings) {
      const r = sib.getBoundingClientRect();
      const sibCenter = r.top + r.height / 2;
      if (itemCenter < sibCenter) { target = sib; break; }
    }

    if (target) {
      if (target.previousSibling !== placeholder) listEl.insertBefore(placeholder, target);
    } else {
      if (listEl.lastElementChild !== placeholder) listEl.appendChild(placeholder);
    }
  }

  function endSubDrag(cancelled) {
    if (!_subDrag) return;
    const { k, sid, itemEl, placeholder, listEl } = _subDrag;

    itemEl.classList.remove('dragging');
    itemEl.style.position = '';
    itemEl.style.left = '';
    itemEl.style.top = '';
    itemEl.style.width = '';
    itemEl.style.zIndex = '';

    if (!cancelled) {
      placeholder.replaceWith(itemEl);

      // 依據 DOM 最終順序重排資料
      const finalOrder = [...listEl.querySelectorAll('.bdgp-sub-item')].map(el => +el.dataset.sid);
      const plan = bdgPlan[k];
      if (plan) {
        const bySid = new Map(plan.subs.map(s => [s.id, s]));
        const newSubs = finalOrder.map(id => bySid.get(id)).filter(Boolean);
        // 防止任何遺漏（理論上不會發生）
        plan.subs.forEach(s => { if (!newSubs.includes(s)) newSubs.push(s); });
        plan.subs = newSubs;
        saveBdgPlan();
      }
    } else {
      placeholder.replaceWith(itemEl);
    }

    _subDrag = null;
    renderBdgPlan();
  }

  /* ── 樹狀關聯 Modal ── */
  let _treeRecId = null;

  function openTreePicker(recId) {
    _treeRecId = recId;
    const rec = recs.find(r => r.id === recId);
    renderTreeContent(rec ? rec.bdgRef : null);
    document.getElementById('treeOverlay').classList.add('open');

  function closeTreePicker() {
    document.getElementById('treeOverlay').classList.remove('open');
