  /* ── 待拆帳 Modal ── */
  let _splitRecId   = null;
  let _splitSelCat  = null;
  let _splitSelSub  = null;   // null = 選大分類本身，數字 = subId
  let _splitExpCat  = null;   // 目前展開細分類的大分類 key

  function openSplitModal(recId) {
    const r = recs.find(x => x.id === recId);
    if (!r || r.cat !== UNSPLIT_KEY) return;
    _splitRecId  = recId;
    _splitSelCat = CKEYS[0] || null;
    _splitSelSub = null;
    // 若預設選中的分類有子分類，自動展開
    const _defaultPlan = _splitSelCat ? bdgPlan[_splitSelCat] : null;
    _splitExpCat = (_defaultPlan && _defaultPlan.subs && _defaultPlan.subs.length > 0) ? _splitSelCat : null;
    document.getElementById('splitSub').textContent =
      (r.note ? r.note + ' · ' : '') + '原始金額 NT$' + r.amt.toLocaleString();
    renderSplitModal();
    document.getElementById('splitOverlay').classList.add('open');
    // 調整 box 位置避免鍵盤遮擋
    _splitAdjustForKeyboard();
    setTimeout(() => {
      document.getElementById('splitAmtInput').focus();
    }, 150);
  }

  function _splitAdjustForKeyboard() {
    const box = document.getElementById('splitBox');
    if (!box) return;
    const vv = window.visualViewport;
    if (!vv) return;
    const adjust = () => {
      const offsetFromBottom = window.innerHeight - (vv.offsetTop + vv.height);
      box.style.marginBottom = offsetFromBottom > 0 ? offsetFromBottom + 'px' : '0px';
    };
    adjust();
    vv.addEventListener('resize', adjust);
    vv.addEventListener('scroll', adjust);
    // 關閉時清理
    const cleanup = () => {
      vv.removeEventListener('resize', adjust);
      vv.removeEventListener('scroll', adjust);
      box.style.marginBottom = '0px';
      document.getElementById('splitOverlay').removeEventListener('split-close', cleanup);
    };
    document.getElementById('splitOverlay').addEventListener('split-close', cleanup, { once: true });
  }

  function closeSplitModal() {
    document.getElementById('splitOverlay').classList.remove('open');
    _splitRecId  = null;
    _splitSelCat = null;
    _splitSelSub = null;
    _splitExpCat = null;
    render();
  }

  function renderSplitModal() {
    const r = recs.find(x => x.id === _splitRecId);
    if (!r) { closeSplitModal(); return; }
    const remain = unsplitRemaining(r);

    document.getElementById('splitRemainNum').textContent = remain.toLocaleString();



    // 分類選擇格（支援子分類展開）
    if (!_splitSelCat || !CKEYS.includes(_splitSelCat)) _splitSelCat = CKEYS[0] || null;
    const grid = document.getElementById('splitCatGrid');
    let gridHTML = '';
    CKEYS.forEach(k => {
      const c = CATS[k];
      const plan = bdgPlan[k];
      const hasSubs = plan && plan.subs && plan.subs.length > 0;
      const isCatSel = k === _splitSelCat;
      gridHTML += `<button type="button" class="split-cat-btn${isCatSel ? ' sel' : ''}${hasSubs ? ' has-subs' : ''}" onclick="selectSplitCat('${k}')">
        <span>${c.icon}</span><span class="lbl">${esc(c.lbl)}${hasSubs ? ' ▾' : ''}</span>
      </button>`;
    });
    grid.innerHTML = gridHTML;

    // 子分類區塊（獨立在 grid 之外，避免 grid 欄位問題）
    const subsWrap = document.getElementById('splitSubsWrap');
    const expPlan = _splitExpCat ? bdgPlan[_splitExpCat] : null;
    const expHasSubs = expPlan && expPlan.subs && expPlan.subs.length > 0;
    if (_splitExpCat && expHasSubs) {
      let subsHTML = '';
      expPlan.subs.forEach(s => {
        const isSub = _splitSelCat === _splitExpCat && _splitSelSub === s.id;
        subsHTML += `<button type="button" class="split-sub-btn${isSub ? ' sel' : ''}" onclick="selectSplitSub('${_splitExpCat}',${s.id})">${esc(s.name)}</button>`;
      });
      subsWrap.innerHTML = subsHTML;
      subsWrap.style.display = 'flex';
    } else {
      subsWrap.innerHTML = '';
      subsWrap.style.display = 'none';
    }

    const confirmBtn = document.getElementById('splitConfirmBtn');
    confirmBtn.disabled = remain <= 0;
    confirmBtn.textContent = remain <= 0 ? '已全部拆分完成' : '確認拆分這筆';

    document.getElementById('splitAmtInput').max = remain;
  }

  function selectSplitCat(k) {
    const plan = bdgPlan[k];
    const hasSubs = plan && plan.subs && plan.subs.length > 0;
    if (hasSubs) {
      // 有子分類：展開/收合切換；若已展開且再按一次 = 選大分類本身
      if (_splitExpCat === k) {
        if (_splitSelCat === k) {
          // 已是大分類選中狀態 → 收合
          _splitExpCat = null;
        } else {
          // 展開中但尚未選 → 選大分類本身
          _splitSelCat = k;
          _splitSelSub = null;
        }
      } else {
        _splitExpCat = k;
        _splitSelCat = k;
        _splitSelSub = null;
      }
    } else {
      // 無子分類：直接選取
      _splitSelCat = k;
      _splitSelSub = null;
      _splitExpCat = null;
    }
    renderSplitModal();
  }

  function selectSplitSub(k, subId) {
    _splitSelCat = k;
    _splitSelSub = subId;
    renderSplitModal();
  }

  function confirmSplitPortion() {
    const r = recs.find(x => x.id === _splitRecId);
    if (!r) return;
    const remain = unsplitRemaining(r);
    if (remain <= 0) { toast('已經全部拆分完成了'); return; }

    const inputEl = document.getElementById('splitAmtInput');
    let v = parseFloat(inputEl.value);
    if (!_splitSelCat || !CKEYS.includes(_splitSelCat)) { toast('請選擇分類'); return; }
    if (!v || v <= 0) { v = remain; }  // 未輸入金額 → 全部剩餘金額
    v = Math.round(v * 100) / 100;
    if (v > remain + 0.001) { toast('金額超過剩餘未拆金額'); return; }

    // 建立新紀錄（同日期、指定分類）
    const subName = (_splitSelSub !== null && bdgPlan[_splitSelCat])
      ? (bdgPlan[_splitSelCat].subs.find(s => s.id === _splitSelSub) || {}).name || '' : '';
    const catLabel = CATS[_splitSelCat].lbl + (subName ? ' › ' + subName : '');
    const now = Date.now();
    const newRec = { id: _nextId++, date: r.date, cat: _splitSelCat, amt: v, note: r.note || '', updatedAt: now };
    if (_splitSelSub !== null) newRec.bdgRef = { catKey: _splitSelCat, subId: _splitSelSub };
    recs.push(newRec);

    // 扣減原始待拆帳金額
    r.amt = Math.round((r.amt - v) * 100) / 100;
    r.updatedAt = now;

    // 若已全部拆完，軟刪除原始待拆帳紀錄並關閉
    if (r.amt <= 0) {
      r.deleted   = true;
      r.deletedAt = now;
      r.updatedAt = now;
      save();
      fbSyncRec(newRec);
      fbSyncRec(r);
      toast('🎉 已全部拆分完成！');
      closeSplitModal();
      return;
    }

    save();
    fbSyncRec(newRec);
    fbSyncRec(r);
    inputEl.value = '';
    _splitSelSub = null;
    renderSplitModal();
    toast('已拆分 $' + v.toLocaleString() + ' 到 ' + catLabel);
  }



  function renderTreeContent(cur) {
    let html = '';
    CKEYS.forEach(k => {
      const c    = CATS[k];
      const plan = bdgPlan[k];
      const isParentSel = cur && cur.catKey === k && cur.subId === undefined;
      const hasChildren = plan.subs.length > 0;

      let childrenHtml = '';
      plan.subs.forEach(s => {
        const isSel = cur && cur.catKey === k && cur.subId === s.id;
        childrenHtml += `<button class="tree-child-btn" onclick="selectBdgRef('${k}',${s.id})">
          <span class="tree-c-dot"></span>
          <span class="tree-c-name">${esc(s.name)}</span>
          ${isSel ? '<span class="tree-c-check">✓</span>' : ''}
        </button>`;
      });

      html += `<div class="tree-parent">
        <button class="tree-parent-btn" onclick="treeToggleParent('${k}')">
          <span class="tree-p-icon">${c.icon}</span>
          <span class="tree-p-name">${esc(c.lbl)}</span>
          ${isParentSel ? '<span class="tree-p-check">✓</span>' : ''}
          ${hasChildren ? `<span class="tree-p-arrow" id="tpa-${k}">▶</span>` : ''}
        </button>
        ${hasChildren ? `<div class="tree-children" id="tpc-${k}">${childrenHtml}</div>` : ''}
      </div>`;
    });
    html += `<button class="tree-none-btn" onclick="selectBdgRef(null)">不關聯 / 移除關聯</button>`;
    document.getElementById('treeContent').innerHTML = html;
  }

  function treeToggleParent(k) {
    const ch = document.getElementById('tpc-' + k);
    const ar = document.getElementById('tpa-' + k);
    if (!ch) {
      // no children → directly select parent
      selectBdgRef(k, undefined);
      return;
    }
    const isOpen = ch.classList.contains('open');
    document.querySelectorAll('.tree-children').forEach(el => el.classList.remove('open'));
    document.querySelectorAll('.tree-p-arrow').forEach(el => el.classList.remove('open'));
    if (!isOpen) { ch.classList.add('open'); if (ar) ar.classList.add('open'); }
    else selectBdgRef(k, undefined);
  }

  function selectBdgRef(catKey, subId) {
    if (_treeRecId === null) return;
    const rec = recs.find(r => r.id === _treeRecId);
    if (!rec) return;
    if (!catKey) {
      delete rec.bdgRef;
      toast('已移除關聯');
    } else {
      rec.bdgRef = subId !== undefined ? { catKey, subId } : { catKey };
      // 同步更新記帳分類，讓列表顯示與預算關聯一致
      if (CKEYS.includes(catKey)) rec.cat = catKey;
      const c = CATS[catKey];
      const plan = bdgPlan[catKey];
      const sub  = subId !== undefined ? plan.subs.find(s => s.id === subId) : null;
      toast('已關聯：' + c.icon + ' ' + c.lbl + (sub ? ' › ' + sub.name : ''));
    }
    rec.updatedAt = Date.now();
    save();
    if (rec) fbSyncRec(rec);
    render();
    closeTreePicker();
  }

  /* ── 更新日期標籤顯示 ── */
  function updateDateLbl() {
    const v = document.getElementById('dateInp').value;
    const lbl = document.getElementById('dateLbl');
    if (!v) { lbl.textContent = '選擇日期'; return; }
    const d = new Date(v + 'T00:00:00');
    lbl.textContent = d.toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', weekday: 'short' });
  }

  /* ── Firebase 初始化入口（登入後呼叫） ── */
  window._fbLoadAndInit = async () => {
    // 先讀本地資料
    await loadAll();
    const localMap = new Map(recs.map(r => [r.id, r]));

    // 讀雲端（回傳資料，不覆寫 recs）。離線或未登入 → 只用本機資料
    let cloudRecs = [];
    let cloudOk = false;
    if (navigator.onLine && window._fbUser) {
      window._fbRecsLoadOk = false;
      cloudRecs = await Promise.race([
        fbLoadAll(),
        new Promise(res => setTimeout(() => res([]), 10000))   // 網路太慢就先用本機
      ]);
      cloudOk = window._fbRecsLoadOk === true;
    }

    // 雲端沒資料 → 直接用本地
    if (cloudRecs.length === 0) {
      if (cloudOk) recs.forEach(r => fbSyncRec(r));   // 雲端確定是空的 → 把本機資料補上去
      try { localStorage.setItem('kakeibo_last_open', recs.filter(r => !r.deleted).length > 0 ? '1' : '0'); } catch(e) {}
      await init();
      return;
    }

    // 本地沒資料 → 直接用雲端
    if (localMap.size === 0) {
      recs = cloudRecs;
      try { localStorage.setItem('kakeibo_last_open', recs.filter(r => !r.deleted).length > 0 ? '1' : '0'); } catch(e) {}
      await init();
      return;
    }

    // 兩邊都有資料 → 以 updatedAt 為準合併，誰新誰贏
    const cloudMap = new Map(cloudRecs.map(r => [r.id, r]));
    const merged   = new Map();

    const toPush    = [];   // 離線期間在本機新增／修改過的記錄，需補推雲端
    cloudMap.forEach((r, id) => merged.set(id, r));
    localMap.forEach((local, id) => {
      if (!merged.has(id)) {
        merged.set(id, local);
        toPush.push(local);
      } else {
        const cloud   = merged.get(id);
        const localTs = local.updatedAt || 0;
        const cloudTs = cloud.updatedAt || 0;
        if (localTs > cloudTs) { merged.set(id, local); toPush.push(local); }
      }
    });
    if (cloudOk) toPush.forEach(r => fbSyncRec(r));

    recs = [...merged.values()].sort((a, b) => b.id - a.id);
    try { localStorage.setItem('kakeibo_last_open', recs.filter(r => !r.deleted).length > 0 ? '1' : '0'); } catch(e) {}
    await init();
  };

  /* ── 初始化 ── */
  async function init() {
    // 防止重複初始化（Firebase 登入後會再呼叫一次）
    if (window._initDone) {
      // 只重新載入資料和重繪，不重新綁定事件
      rebuildCats();
      if (CKEYS.length > 0 && !CKEYS.includes(cat)) cat = CKEYS[0];
      initBdgPlan();
      if (recs.length > 0) _nextId = Math.max(...recs.map(r => r.id)) + 1;
      renderCatBtns();
      render();
      return;
    }
    window._initDone = true;
    rebuildCats();
    // 還原上次使用的分類（跳過待拆帳）
    try {
      const saved = localStorage.getItem(SK_CAT);
      if (saved && CKEYS.includes(saved)) cat = saved;
    } catch(e) {}
    if (CKEYS.length > 0 && !CKEYS.includes(cat)) cat = CKEYS[0];
    initBdgPlan(); // 確保每個 catKey 都有預算結構
    // 從現有資料的最大 id 繼續，避免重複
    if (recs.length > 0) _nextId = Math.max(...recs.map(r => r.id)) + 1;

    // 資料重置偵測：延遲到 Firebase 載入完成後再判斷（避免登入前 recs 為空時誤報）
    const SK_LAST = 'kakeibo_last_open';
    const lastHadData = localStorage.getItem(SK_LAST) === '1';
    if (lastHadData && recs.length === 0 && !window._fbUser) {
      // 只有在確定不是等待 Firebase 的狀況下才警告
      setTimeout(() => {
        if (recs.length === 0) toast('⚠️ 偵測到資料可能被清除，請確認或匯入備份');
      }, 3000); // 給 Firebase 3 秒登入時間，若還是空的才警告
    }
    // SK_LAST 的最終寫入由 _fbLoadAndInit 負責，這裡只在非 Firebase 模式下寫入
    if (!window._fbUser) {
      try { localStorage.setItem(SK_LAST, recs.length > 0 ? '1' : '0'); } catch(e) {}
    }

    // 請求持久化儲存 + 空間偵測
    if (navigator.storage) {
      if (navigator.storage.persist) {
        navigator.storage.persist().catch(() => {});
      }
      if (navigator.storage.estimate) {
        navigator.storage.estimate().then(est => {
          const remainingMB = (est.quota - est.usage) / 1024 / 1024;
          if (remainingMB < 100) {
            toast('⚠️ 裝置空間不足，記帳資料可能有遺失風險');
          }
        }).catch(() => {});
      }
    }

    const now = new Date();
    vy = now.getFullYear();
    vm = now.getMonth();
    document.getElementById('dateInp').value = fmtD(now);
    updateDateLbl();
    document.getElementById('dateInp').addEventListener('change', updateDateLbl);

    renderCatBtns();
    setupLongPress();
    setupListLongPress();
    setupEmojiPicker();

    // 月份按鈕
    document.getElementById('btnPrevM').addEventListener('touchstart', e => { e.preventDefault(); chM(-1); }, { passive: false });
    document.getElementById('btnNextM').addEventListener('touchstart', e => { e.preventDefault(); chM(1);  }, { passive: false });
    document.getElementById('btnPrevM').addEventListener('click', () => chM(-1));
    document.getElementById('btnNextM').addEventListener('click', () => chM(1));

    // Tab 按鈕
    document.getElementById('tabList').onclick = () => goTab('list');
    document.getElementById('tabAna').onclick  = () => goTab('ana');
    document.getElementById('tabBdgPlan').onclick = () => goTab('bdgplan');

    // tree overlay
    document.getElementById('treeCancelBtn').onclick = closeTreePicker;
    document.getElementById('treeOverlay').addEventListener('click', e => {
      if (e.target === document.getElementById('treeOverlay')) closeTreePicker();
    });

    // split overlay (待拆帳)
    document.getElementById('splitOverlay').addEventListener('click', e => {
      if (e.target === document.getElementById('splitOverlay')) closeSplitModal();
    });

    // backup menu overlay
    const bmo = document.getElementById('backupMenuOverlay');
    bmo.style.display = 'flex';
    bmo.style.display = 'none';
    bmo.addEventListener('click', e => { if (e.target === bmo) closeBackupMenu(); });

    // month picker
    document.getElementById('mpYearPrev').onclick = () => { mpYear--; renderMpYear(); };
    document.getElementById('mpYearNext').onclick = () => { mpYear++; renderMpYear(); };
    document.getElementById('mpCancelBtn').onclick = closeMp;
    document.getElementById('monthPickerOverlay').addEventListener('click', e => {
      if (e.target === document.getElementById('monthPickerOverlay')) closeMp();
    });
    document.getElementById('mLabel').onclick = openMonthPicker;


    // budget modal
    document.getElementById('budgetCancelBtn').onclick = closeBudget;
    document.getElementById('budgetOkBtn').onclick     = confirmBudget;
    document.getElementById('budgetInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') confirmBudget();
      if (e.key === 'Escape') closeBudget();
    });
    document.getElementById('budgetOverlay').addEventListener('click', e => {
      if (e.target === document.getElementById('budgetOverlay')) closeBudget();
    });

    document.getElementById('editNoteCancelBtn').onclick = closeEditNote;
    document.getElementById('editNoteOkBtn').onclick     = confirmEditNote;
    document.getElementById('editNoteInp').addEventListener('keydown', e => {
      if (e.key === 'Enter') confirmEditNote();
      if (e.key === 'Escape') closeEditNote();
    });
    document.getElementById('editNoteOverlay').addEventListener('click', e => {
      if (e.target === document.getElementById('editNoteOverlay')) closeEditNote();
    });

    // 長按右上角金額 → 設定上限
    setupTotalLongPress();

    setupSwipe();
    markActivePanel(ctab);
    settlePanels(0);
    setupBdgHeadLongPress();
    setupMonthSwipe();
    setupKbCollapse();
    setupTopBar();
    installHTMLGuard('listPanel');
    installHTMLGuard('anaPanel');

    // 數字鍵盤：touchstart event delegation（只綁在數字鍵區域，不要綁在整個 kbGrid，
    // 否則 { passive:false } 會讓瀏覽器對右側可捲動分類清單也要等 JS 跑完才能決定要不要捲動，導致卡頓/無法捲動）
    const grid = document.querySelector('.kb-numgrid');
    let delInterval = null;
    let delTimeout  = null;

    const startDel = () => {
      nd();
      delTimeout = setTimeout(() => {
        delInterval = setInterval(() => { nd(); }, 80);
      }, 400);
    };
    const stopDel = () => {
      clearTimeout(delTimeout);
      clearInterval(delInterval);
      delTimeout = delInterval = null;
    };

    grid.addEventListener('touchstart', e => {
      const btn = e.target.closest('[data-n],[data-del],[data-ok]');
      if (!btn) return;
      e.preventDefault();
      btn.classList.add('pressed');
      setTimeout(() => btn.classList.remove('pressed'), 90);
      if (btn.dataset.n   !== undefined) ni(btn.dataset.n);
      else if (btn.dataset.del !== undefined) startDel();
      else if (btn.dataset.ok  !== undefined) addRec();
    }, { passive: false });

    grid.addEventListener('touchend',    e => { if (e.target.closest('[data-del]')) stopDel(); }, { passive: true });
    grid.addEventListener('touchcancel', e => { if (e.target.closest('[data-del]')) stopDel(); }, { passive: true });

    // 桌機 mousedown fallback（數字鍵）
    grid.addEventListener('mousedown', e => {
      const btn = e.target.closest('[data-n],[data-del],[data-ok]');
      if (!btn) return;
      if (btn.dataset.n   !== undefined) ni(btn.dataset.n);
      else if (btn.dataset.del !== undefined) startDel();
      else if (btn.dataset.ok  !== undefined) addRec();
    });
    grid.addEventListener('mouseup',    e => { if (e.target.closest('[data-del]')) stopDel(); });
    grid.addEventListener('mouseleave', e => { if (delInterval || delTimeout) stopDel(); });

    // Rename Modal 按鈕
    document.getElementById('renameCancelBtn').onclick = closeRename;
    document.getElementById('renameOkBtn').onclick     = confirmRename;
    document.getElementById('renameInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') confirmRename();
      if (e.key === 'Escape') closeRename();
    });
    // 點擊背景關閉
    document.getElementById('renameOverlay').addEventListener('click', e => {
      if (e.target === document.getElementById('renameOverlay')) closeRename();
    });

    render();
  }

  /* ── 數字鍵盤：不在輸入時自動收起 ──
     收起 = 整個鍵盤往下滑，只露出金額列（NT$ / 💾 / 日期）。
     展開：點收起狀態的金額列、點／上滑把手。
     收起：點鍵盤以外的任何地方、下滑把手或金額列、按「記帳」後、其他輸入框取得焦點時。 */
  const KB_START_COLLAPSED = true;   // 開啟 App 時是否先收起；想一開始就展開改成 false
  let kbOpen = !KB_START_COLLAPSED;

  function setKb(open) {
    if (kbOpen === open) return;
    kbOpen = open;
    document.body.classList.toggle('kb-collapsed', !open);
    if (!open) {
      const n = document.getElementById('noteInp');
      if (n) n.blur();
    }
  }

  function setupKbCollapse() {
    const kbEl = document.getElementById('kb');
    document.body.classList.toggle('kb-collapsed', !kbOpen);

    // 收起狀態下，點金額列的空白處 → 展開（💾、日期按鈕照常作用）
    kbEl.addEventListener('click', e => {
      if (!kbOpen && !e.target.closest('button, #dateLbl, input')) setKb(true);
    });

    // 下滑收起、上滑展開（從金額列／把手那一帶開始滑）
    let startY = null;
    const zone = kbEl.querySelector('.kb-r1');
    zone.addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, { passive: true });
    zone.addEventListener('touchend', e => {
      if (startY === null) return;
      const dy = e.changedTouches[0].clientY - startY;
      startY = null;
      if (dy > 24) setKb(false);
      else if (dy < -24) setKb(true);
    }, { passive: true });
    zone.addEventListener('touchcancel', () => { startY = null; }, { passive: true });

    // 明細頁上滑 → 叫出記帳區（記帳區收起時）
    //   ① 清單已捲到底（或內容不滿一頁）時，往上滑一下
    //   ② 從畫面最下方一小塊區域開始往上滑
    //   ③ 任何位置「快速上甩」（慢慢捲清單不會觸發）
    const OVERLAY_SEL = '#renameOverlay.open, #budgetOverlay.open, #editNoteOverlay.open, #monthPickerOverlay.open, #emojiOverlay.open, #treeOverlay.open, #splitOverlay.open';
    const SWIPE_UP_MIN  = 40;     // ①② 往上至少滑多少 px
    const BOTTOM_ZONE   = 140;    // ② 底部觸發區高度 px
    const FLICK_MIN_DY  = 50;     // ③ 快速上甩：至少滑多少 px
    const FLICK_SPEED   = 1.0;    // ③ 放開前的速度（px/ms）；越大越要用力甩，覺得太容易誤觸就調高、太難觸發就調低
    let upSX = 0, upSY = 0, upTrack = false, upZone = false, upPts = [];
    document.addEventListener('touchstart', e => {
      upTrack = false; upZone = false; upPts = [];
      if (kbOpen || ctab !== 'list' || e.touches.length !== 1) return;
      if (e.target.closest('#kb, input, textarea, select')) return;
      if (document.querySelector(OVERLAY_SEL)) return;
      const t = e.touches[0];
      upSX = t.clientX; upSY = t.clientY;
      const el = document.scrollingElement || document.documentElement;
      const atBottom = el.scrollTop + window.innerHeight >= el.scrollHeight - 4;
      const inBottomZone = upSY > window.innerHeight - BOTTOM_ZONE;
      upZone = atBottom || inBottomZone;
      upTrack = true;
      upPts = [{ y: t.clientY, t: e.timeStamp }];
    }, { passive: true });
    document.addEventListener('touchmove', e => {
      if (!upTrack) return;
      upPts.push({ y: e.touches[0].clientY, t: e.timeStamp });
      if (upPts.length > 12) upPts.shift();
    }, { passive: true });
    document.addEventListener('touchend', e => {
      if (!upTrack) return;
      upTrack = false;
      if (kbOpen) return;
      const t = e.changedTouches[0];
      const dy = t.clientY - upSY, dx = t.clientX - upSX;
      if (Math.abs(dy) <= Math.abs(dx) * 1.5) return;          // 要偏直向，橫滑切分頁不受影響
      if (upZone && dy < -SWIPE_UP_MIN) { setKb(true); return; }
      // 快速上甩：看放開前最後 ~100ms 的速度
      if (dy < -FLICK_MIN_DY && upPts.length >= 2) {
        const last = upPts[upPts.length - 1];
        let first = upPts[0];
        for (const p of upPts) { if (last.t - p.t <= 100) { first = p; break; } }
        const dt = last.t - first.t;
        if (dt > 0 && (first.y - last.y) / dt >= FLICK_SPEED) setKb(true);
      }
    }, { passive: true });
    document.addEventListener('touchcancel', () => { upTrack = false; }, { passive: true });

    // 點鍵盤以外的地方 → 收起（不攔截事件，點到的東西照常作用）
    document.addEventListener('pointerdown', e => {
      if (kbOpen && !e.target.closest('#kb')) setKb(false);
    }, true);
    // 其他輸入框（預算、名稱…）取得焦點 → 收起，避免和系統鍵盤重疊
    document.addEventListener('focusin', e => {
      const t = e.target;
      if (kbOpen && t && t.matches && t.matches('input, textarea, select') && !t.closest('#kb')) setKb(false);
    });
  }

    catSub = null;                         // 手動點分類 = 不指定子分類

  /* ── 新增記帳 ── */
  function addRec() {
    const amt = parseInt(inp, 10);
    if (!amt || amt <= 0) { toast('請輸入金額'); return; }

    const dv = document.getElementById('dateInp').value;
    if (!dv) { toast('請選日期'); return; }

    const note = document.getElementById('noteInp').value.trim();
    const newRec = { id: _nextId++, date: dv, cat, amt, note, updatedAt: Date.now() };
    // 若有用長按選子分類 → 寫入 bdgRef，預算頁會直接算進該子分類
    let subLabel = '';
    if (catSub !== null && cat !== UNSPLIT_KEY && bdgPlan[cat]) {
      const sb = bdgPlan[cat].subs.find(x => x.id === catSub);
      if (sb) { newRec.bdgRef = { catKey: cat, subId: sb.id }; subLabel = ' › ' + subName(sb, dv.slice(0, 7)); }
    }
    catSub = null; // 記完就清掉，避免下一筆誤歸到同一個子分類
    syncCatBtns();
    recs.unshift(newRec);
    save();
    fbSyncRec(newRec);

    inp = '';
    ud();
    document.getElementById('noteInp').value = '';

    const d = new Date(dv + 'T00:00:00');
    vy = d.getFullYear();
    vm = d.getMonth();
    render();
    toast(CATS[cat].icon + subLabel + ' NT$' + amt.toLocaleString());
    setKb(false);   // 記完帳就收起，讓剛記的那筆露出來
  }

  /* ── ri-info 長按 = 編輯備註，短按 = 原有行為 ── */
  const _lpTimers = new WeakMap();
  function riLongPressStart(e, el) {

      _lpTimers.set(el, null);
      if (navigator.vibrate) navigator.vibrate(40);
      openEditNote(parseInt(el.dataset.id));
    }, 480);
    _lpTimers.set(el, t);
  }
  function riLongPressEnd(e, el) {

  }
  function riLongPressCancel(el) {
    const t = _lpTimers.get(el);
    if (t && t !== 'tap') clearTimeout(t);
    _lpTimers.set(el, null);
  }
  function riInfoClick(e, el) {
    const state = _lpTimers.get(el);
    if (state === null) { _lpTimers.delete(el); return; }
    _lpTimers.delete(el); // 清除殘留狀態
    const id     = parseInt(el.dataset.id);
    const action = el.dataset.action;

  /* ── 切換月份 ── */
  function chM(d) {
    vm += d;
    if (vm > 11) { vm = 0; vy++; }
    if (vm < 0)  { vm = 11; vy--; }
    collapsed = {};
    // 切換月份時同步清空分析頁展開狀態，行為與折疊狀態一致
    Object.keys(anaOpen).forEach(k => delete anaOpen[k]);

  /* ── 分頁高度：動畫結束後把非目前分頁收合（避免被最長的分頁撐出空白） ── */
  let _settleTimer = null;
  function unsettlePanels() {
    clearTimeout(_settleTimer);
    const w = document.getElementById('panelWrap');
    if (w) {
      w.classList.remove('settled');
      w.querySelectorAll('.swipe-panel:not(.is-active)').forEach(p => p.classList.add('peek'));
    }
  }
  function settlePanels(ms) {
    clearTimeout(_settleTimer);
    const apply = () => {
      const w = document.getElementById('panelWrap');
      if (!w) return;
      w.classList.add('settled');
      w.querySelectorAll('.peek').forEach(p => p.classList.remove('peek'));
    };
    if (ms > 0) _settleTimer = setTimeout(apply, ms); else apply();
  }
  function markActivePanel(t) {
    const ids = { list: 'listPanel', ana: 'anaPanel', bdgplan: 'bdgPlanPanel' };
    Object.keys(ids).forEach(k => {
      const el = document.getElementById(ids[k]);
      if (el) el.classList.toggle('is-active', k === t);
    });
  }

  /* ── 切換 Tab ── */
  function goTab(t) {
    if (ctab === t) return;
    ctab = t;
    unsettlePanels();
    markActivePanel(t);
    settlePanels(380);
    document.getElementById('tabList').classList.toggle('on', t === 'list');
    document.getElementById('tabAna').classList.toggle('on', t === 'ana');
    document.getElementById('tabBdgPlan').classList.toggle('on', t === 'bdgplan');
    // 先更新 transform（讓動畫立即啟動），下一幀才渲染內容（避免阻塞動畫）
    const wrap = document.getElementById('panelWrap');
    if (wrap) {
      if (t === 'list')     wrap.style.transform = 'translateX(0)';
      else if (t === 'ana') wrap.style.transform = 'translateX(-33.333%)';
      else                  wrap.style.transform = 'translateX(-66.666%)';
    }
    // 重畫內容會卡住主執行緒，若跟切換動畫同時進行，動畫會卡在一半。
    //  - 這個分頁從沒畫過（空的）→ 馬上畫，不然滑進來會是空白
    //  - 已經有內容 → 等動畫結束(約 320ms)再更新；內容沒變就不重建 DOM（見 installHTMLGuard）
    const target = { list: 'listPanel', ana: 'anaPanel', bdgplan: 'bdgPlanPanel' }[t];
    const tEl = document.getElementById(target);
    if (!tEl || !tEl.innerHTML) {
      requestAnimationFrame(() => render());
    } else {
      clearTimeout(_tabRenderTimer);
      _tabRenderTimer = setTimeout(() => {
        if (ctab !== t) return;
        _guardHTML = true;
        try { render(); } finally { _guardHTML = false; }
      }, 340);
    }
  }

  // 明細／分析面板：切換分頁時若新內容和上次完全相同，就略過 innerHTML 重建（省下大量 DOM 建立與重繪）
  // 只有切換分頁的那次重畫會略過；一般的資料更新仍然照常重建。預算頁有拖曳排序會直接動 DOM，所以不套用。
  let _guardHTML = false, _tabRenderTimer = null;
  function installHTMLGuard(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const d = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML');
    let last = null;
    Object.defineProperty(el, 'innerHTML', {
      configurable: true,
      get() { return d.get.call(this); },
      set(v) {
        v = String(v);
        if (_guardHTML && v === last) return;
        last = v;
        d.set.call(this, v);
      }
    });
  }

    collapsed[date] = !collapsed[date];
    const items = document.getElementById('di-' + date);
    const arrow = document.getElementById('da-' + date);
    if (items) items.style.display = collapsed[date] ? 'none' : 'block';
    if (arrow) arrow.textContent   = collapsed[date] ? '▸' : '▾';

  /* ── 取得當月記帳 ── */
  function getMrs() {
    const p = vy + '-' + String(vm + 1).padStart(2, '0');
    return recs.filter(r => r.date.startsWith(p) && !r.deleted);
  }

  /* ── 切換總額顯示模式 ── */
  let totalModeTipTimer = null;
  function toggleTotalDisplay() {
    totalMode = (totalMode + 1) % 3;   // 全部 → 預算內 → 預算外 → 全部
    saveMode();
    render();
    const tip = document.getElementById('totalModeTip');
    if (!tip.querySelector('span')) tip.innerHTML = '<span></span>';
    const s = tip.querySelector('span');
    s.textContent = '顯示：' + TOTAL_MODE_NAMES[totalMode];
    s.className = 'm' + totalMode + ' show';   // 提示底色跟著模式變色
    clearTimeout(totalModeTipTimer);

  /* ── 主渲染 ── */
  function render() {
    const mn = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    document.getElementById('mLabel').textContent = vy + '．' + mn[vm];
    const mrs   = getMrs();
    const total = mrs.reduce((s, r) => s + r.amt, 0);
    const budgetTotal = mrs.reduce((s, r) => s + (r.exempt ? 0 : r.amt), 0);

    const tEl   = document.getElementById('totalAmt');
    const tNum  = document.getElementById('tNum');
    const hint  = document.getElementById('budgetHint');

    const exemptMrs   = mrs.filter(r => r.exempt);
    const exemptTotal = exemptMrs.reduce((s, r) => s + r.amt, 0);
    const displayTotal = totalMode === 1 ? budgetTotal : totalMode === 2 ? exemptTotal : total;
    const inBudgetMode = totalMode === 1;
    tEl.classList.remove('m0', 'm1', 'm2');
    tEl.classList.add('m' + totalMode);

    if (totalMode === 2) {
      // 預算外：不套用上限判斷，只顯示被排除在預算外的花費
      tNum.textContent = exemptTotal.toLocaleString();
      tEl.classList.remove('over');
      hint.textContent = '預算外　共 ' + exemptMrs.length + ' 筆';
      hint.className = '';
    } else if (budget > 0 && budgetTotal > budget) {
      // 預算超出判斷
      const diff = budgetTotal - budget;
      tNum.textContent = inBudgetMode ? ('-' + diff.toLocaleString()) : total.toLocaleString();
      tEl.classList.toggle('over', inBudgetMode);
      hint.textContent = inBudgetMode ? '超出上限 NT$' + budget.toLocaleString() : '⚠ 預算內已超出';
      hint.className = 'over';
    } else {
      tNum.textContent = displayTotal.toLocaleString();
      tEl.classList.remove('over');
      if (budget > 0) {
        const rem = budget - budgetTotal;
        hint.textContent = '上限 NT$' + budget.toLocaleString() + '　剩 ' + rem.toLocaleString();
        hint.className = '';
      } else {
        hint.textContent = '';
        hint.className = '';
      }
    }

    // 只渲染當前 tab，避免切換時三個 panel 同時重繪造成卡頓
    const displayMrs = modeMrs(mrs);
    if (ctab === 'list')     renderList(displayMrs, mrs);
    else if (ctab === 'ana') renderAna(displayMrs, displayTotal);
    else                     renderBdgPlan();
  }

  /* ── 列表渲染 ── */
  function renderList(mrs, allMrs) {
    const lp = document.getElementById('listPanel');

    // 過濾模式：只看未關聯預算的項目 / 只看待拆帳項目
    let displayList = mrs;
    if (listFilterUnsplitOnly) {
      displayList = mrs.filter(r => r.cat === UNSPLIT_KEY && unsplitRemaining(r) > 0);
    } else if (listFilterUnlinked) {
      // 「未關聯」= 沒有歸到任何大分類，或該大分類有細項但這筆還沒選細項
      displayList = mrs.filter(r => {
        if (r.cat === UNSPLIT_KEY) return false;
        const ref = effBdgRef(r);
        if (!ref) return true;
        const plan = bdgPlan[ref.catKey];
        return ref.subId === undefined && !!(plan && plan.subs && plan.subs.length > 0);
      });
    }

    const filterBanner = listFilterUnsplitOnly
      ? `<div class="list-filter-banner" onclick="listFilterUnsplitOnly=false;render()">
          <span>✂️ 只顯示待拆帳項目 · 共 ${displayList.length} 筆</span>
          <span class="list-filter-close">✕ 取消</span>
        </div>`
      : listFilterUnlinked
      ? `<div class="list-filter-banner" onclick="listFilterUnlinked=false;render()">
          <span>🔍 只顯示未關聯預算的項目 · 共 ${displayList.length} 筆</span>
          <span class="list-filter-close">✕ 取消</span>
        </div>`
      : '';

    if (displayList.length === 0) {
      lp.innerHTML = filterBanner + (listFilterUnsplitOnly
        ? '<div class="empty"><div class="empty-ico">✅</div>沒有待拆帳的項目了！</div>'
        : listFilterUnlinked
        ? '<div class="empty"><div class="empty-ico">✅</div>全部項目都已關聯預算了！</div>'
        : '<div class="empty"><div class="empty-ico">🌸</div>' + (totalMode === 2 ? '這個月沒有預算外支出' : '這個月還沒有記帳') + '</div>');
      return;
    }

    const g = {};
    displayList.forEach(r => { (g[r.date] = g[r.date] || []).push(r); });
    const dates = Object.keys(g).sort((a, b) => b.localeCompare(a));

    lp.innerHTML = filterBanner + dates.map(date => {
      const d  = new Date(date + 'T00:00:00');
      const dl = d.toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', weekday: 'short' });
      const dt = g[date].reduce((s, r) => s + r.amt, 0);
      const isCollapsed = !!collapsed[date];

      const items = g[date].map(r => {
        const rym = (r.date || '').slice(0, 7);   // 依紀錄所在月份顯示當時的分類名稱
        const c = CATS[r.cat] || UNCATEGORIZED;
        const isUnsplit = r.cat === UNSPLIT_KEY;
        const remain = isUnsplit ? unsplitRemaining(r) : 0;
        const isDone = isUnsplit && remain <= 0;

        // icon 優先顯示已關聯的預算分類 icon
        const displayIcon = (!isUnsplit && r.bdgRef && r.bdgRef.catKey && CATS[r.bdgRef.catKey])
          ? CATS[r.bdgRef.catKey].icon
          : c.icon;
        let bdgTag = '';
        if (!isUnsplit && r.bdgRef && r.bdgRef.catKey) {
          const rc = CATS[r.bdgRef.catKey];
          const plan = bdgPlan[r.bdgRef.catKey];
          if (rc && plan) {
            const sub = r.bdgRef.subId !== undefined ? plan.subs.find(s => s.id === r.bdgRef.subId) : null;
            bdgTag = `<span class="ri-bdg-tag">${rc.icon} ${esc(catLbl(r.bdgRef.catKey, rym))}${sub ? ' › '+esc(subName(sub, rym)) : ''}</span>`;
          }
        }
        let unsplitTag = '';
        if (isUnsplit) {
          unsplitTag = isDone
            ? `<span class="ri-bdg-tag ri-unsplit-done">已拆分完成</span>`
            : `<span class="ri-bdg-tag ri-unsplit-tag">剩 $${remain.toLocaleString()} 未拆</span>`;
        }

        // 如果已關聯預算分類/子分類，前面不重複顯示分類文字（標籤本身已包含完整資訊），避免「圖示是B、文字卻還是A」的不一致
        const linkedCat = (!isUnsplit && r.bdgRef && r.bdgRef.catKey && CATS[r.bdgRef.catKey]) ? CATS[r.bdgRef.catKey] : null;
        const plainLbl = linkedCat ? '' : (CATS[r.cat] ? catLbl(r.cat, rym) : c.lbl);
        const noteFallbackLbl = linkedCat ? catLbl(r.bdgRef.catKey, rym) : (CATS[r.cat] ? catLbl(r.cat, rym) : c.lbl);

        const rowAction = isUnsplit ? 'split' : 'tree';

        return `<div class="ri${r.exempt ? ' exempt-row' : ''}${isUnsplit ? ' ri-unsplit' : ''}">
          <div class="ri-ico" style="cursor:pointer" onclick="${isUnsplit ? `openSplitModal(${r.id})` : `openTreePicker(${r.id})`}" title="${isUnsplit ? '點擊拆分' : '點擊關聯預算'}">${displayIcon}</div>
          <div class="ri-info"
            oncontextmenu="openEditNote(${r.id});return false"
            style="-webkit-user-select:none;user-select:none;touch-action:manipulation;cursor:pointer"
            data-action="${rowAction}"
            data-id="${r.id}"
            ontouchstart="riLongPressStart(event,this)"
            ontouchend="riLongPressEnd(event,this)"
            ontouchcancel="riLongPressCancel(this)"
            ontouchmove="riLongPressCancel(this)"
            onclick="riInfoClick(event,this)"
          >
            <div class="ri-note">${r.note ? esc(r.note) : noteFallbackLbl}</div>
            <div class="ri-cat">${plainLbl}${bdgTag}${unsplitTag}</div>
          </div>
          <div class="ri-amt${r.exempt ? ' exempt' : ''}" onclick="${isUnsplit ? `openSplitModal(${r.id})` : `toggleExempt(${r.id})`}" title="${isUnsplit ? '點擊拆分' : '點擊切換是否計入預算'}"><small>$</small>${r.amt.toLocaleString()}</div>
          <button class="ri-del" onclick="delRec(${r.id})">✕</button>
        </div>`;
      }).join('');

      return `
        <div class="dg-head" onclick="toggleDate('${date}')">
          <span><span id="da-${date}" class="dg-arrow">${isCollapsed ? '▸' : '▾'}</span> ${dl}</span>
          <span style="color:var(--roseDk);font-family:Montserrat,sans-serif;font-weight:700">$${dt.toLocaleString()}</span>
        </div>
        <div id="di-${date}" style="display:${isCollapsed ? 'none' : 'block'}">${items}</div>`;
    }).join('');
  }

  /* ── 分析展開狀態 ── */
  const anaOpen = {};

  /* ── 分析渲染 ── */
  function renderAna(mrs, total) {
    const ap = document.getElementById('anaPanel');
    if (mrs.length === 0) {
      ap.innerHTML = '<div class="ana-empty">' + (totalMode === 2 ? '這個月沒有預算外支出 🌸' : '這個月還沒有記帳 🌸') + '</div>';
      return;
    }

    const tv = {};
    CKEYS.forEach(k => { tv[k] = 0; });
    let unsplitRemain = 0;
    let uncategorizedTotal = 0;
    mrs.forEach(r => {
      if (r.cat === UNSPLIT_KEY) {
        // 待拆帳本身不計入一般分類統計（拆出去的已是獨立紀錄，會由對應分類自行計入）
        unsplitRemain += unsplitRemaining(r);
        return;
      }
      const eref = effBdgRef(r);
      if (eref) {
        tv[eref.catKey] += r.amt; // 與預算頁使用同一套歸屬規則，數字才會一致
      } else {
        uncategorizedTotal += r.amt; // 分類已被刪除的舊紀錄
      }
    });

    // 本月各細分類實際花費（透過 bdgRef）— 在展開時按需計算
    // 色彩條與下方卡片同一個順序（金額多到少）；顏色仍依分類本身的位置，不會跟著變
    const sorted = [...CKEYS].sort((a, b) => tv[b] - tv[a]);
    const segs = sorted.map(k => {
      const i = CKEYS.indexOf(k);
      const pct = total > 0 ? (tv[k] / total * 100) : 0;
      return pct > 0
        ? `<div class="stack-seg" style="width:${pct.toFixed(1)}%;background:${catColor(i)}"></div>`
        : '';
    }).join('') + (uncategorizedTotal > 0 && total > 0
      ? `<div class="stack-seg" style="width:${(uncategorizedTotal/total*100).toFixed(1)}%;background:#c9bdb5"></div>`
      : '');

    const aym   = curYM();
    const carry = getCarry(aym);
    const cards = sorted.map(k => {
      const i    = CKEYS.indexOf(k);
      const c    = CATS[k];
      const v    = tv[k];
      const pct  = total > 0 ? Math.round(v / total * 100) : 0;
      const plan = bdgPlan[k] || { budget: 0, subs: [] };
      const isOpen = !!anaOpen[k];

      // 細分類列表（只顯示有資料的，加上預算對比）
      let subsHtml = '';
      if (isOpen) {
        const bdgSp = getBdgSpending();
        if (plan.subs.length > 0) {
          plan.subs.forEach(s => {
            const ss    = bdgSp[k + ':' + s.id] || 0;
            const sbase = subBudgetAt(s, aym);
            const sbud  = subBudgetEff(k, s, aym, carry);
            const sOver = sbase > 0 && ss > sbud;
            const sRem  = sbase > 0 ? sbud - ss : null;
            subsHtml += `<div class="ana-sub-row">
              <span class="ana-sub-dot"></span>
              <span class="ana-sub-name">${esc(subName(s, aym))}</span>
              ${sbase > 0 ? `<span class="ana-sub-budget">${fmtMoney(sbud)}</span>` : ''}
              <span class="ana-sub-spent${sOver?' over':''}">$${ss.toLocaleString()}</span>
              ${sRem !== null ? `<span class="ana-sub-rem${sOver?' over':''}">剩$${Math.max(0,sRem).toLocaleString()}</span>` : ''}
            </div>`;
          });
          const noSub = (bdgSp[k] || 0) - plan.subs.reduce((a, s) => a + (bdgSp[k + ':' + s.id] || 0), 0);
          if (noSub > 0) {
            subsHtml += `<div class="ana-sub-row"><span class="ana-sub-dot"></span>
              <span class="ana-sub-name">未指定細項</span>
              <span class="ana-sub-spent">$${noSub.toLocaleString()}</span></div>`;
          }
        } else {
          const cbase = catBudgetAt(k, aym);
          const cbud = catBudgetEff(k, aym, carry);
          const cs   = bdgSp[k] || 0;
          subsHtml = cbase > 0
            ? `<div class="ana-sub-row"><span class="ana-sub-dot"></span>
                <span class="ana-sub-name">大項目預算</span>
                <span class="ana-sub-budget">${fmtMoney(cbud)}</span>
                <span class="ana-sub-spent${cs>cbud?' over':''}">$${cs.toLocaleString()}</span>
                <span class="ana-sub-rem${cs>cbud?' over':''}">剩$${Math.max(0,cbud-cs).toLocaleString()}</span></div>`
            : `<div class="ana-no-sub">尚未設定預算 → 前往「預算」頁設定</div>`;
        }
      }

      return `<div class="cat-card" onclick="toggleAnaCard('${k}')" style="cursor:pointer">
        <div class="cat-card-top">
          <div class="cat-dot" style="background:${catColor(i)}"></div>
          <div class="cat-name">${c.icon} ${esc(catLbl(k, aym))}</div>
          <div class="cat-pct">${pct}%</div>
          <div class="cat-amt"><small>$</small>${v.toLocaleString()}</div>
          <span style="font-size:9px;color:var(--rose);margin-left:4px">${isOpen ? '▴' : '▾'}</span>
        </div>
        <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${catColor(i)}"></div></div>
        ${isOpen ? `<div class="ana-subs-wrap">${subsHtml}</div>` : ''}
      </div>`;
    }).join('') + (uncategorizedTotal > 0 ? `<div class="cat-card">
        <div class="cat-card-top">
          <div class="cat-dot" style="background:#c9bdb5"></div>
          <div class="cat-name">🏷️ 未分類（分類已刪除）</div>
          <div class="cat-pct">${total > 0 ? Math.round(uncategorizedTotal/total*100) : 0}%</div>
          <div class="cat-amt"><small>$</small>${uncategorizedTotal.toLocaleString()}</div>
        </div>
        <div class="bar-bg"><div class="bar-fill" style="width:${total>0?Math.round(uncategorizedTotal/total*100):0}%;background:#c9bdb5"></div></div>
      </div>` : '');

    const legend = CKEYS
      .filter(k => tv[k] > 0)
      .map(k => {
        const i = CKEYS.indexOf(k);
        return `<span style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${catColor(i)}"></span>
          ${esc(catLbl(k, curYM()))}
        </span>`;
      }).join('') + (uncategorizedTotal > 0 ? `<span style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#c9bdb5"></span>
          未分類
        </span>` : '');

    ap.innerHTML = `
      <div class="ana-total">
        <div class="ana-total-label">${totalMode === 2 ? '本月預算外支出' : totalMode === 1 ? '本月預算內支出' : '本月支出'}</div>
        <div class="ana-total-num"><small>NT$</small>${total.toLocaleString()}</div>
      </div>
      ${unsplitRemain > 0 ? `<div class="ana-unsplit-banner" onclick="goToUnsplitFilter()">
        <span>✂️ 本月待拆帳尚有 <b>$${unsplitRemain.toLocaleString()}</b> 未分配</span>
        <span class="ana-unsplit-go">前往明細 ›</span>
      </div>` : ''}
      <div class="ana-stack-wrap">
        <div class="stack-bar">${segs}</div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:2px">${legend}</div>
      </div>
      ${cards}`;
  }

  function rerenderAna() {
    const displayMrs = modeMrs(getMrs());
    renderAna(displayMrs, displayMrs.reduce((s, r) => s + r.amt, 0));
  }

  function toggleAnaCard(k) {
    anaOpen[k] = !anaOpen[k];
    rerenderAna();
  }

  /* ── Toast ── */
  let _toastTimer = null;
  function toast(msg, undo) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.toggle('has-undo', !!undo);
    if (undo) {
      const b = document.createElement('button');
      b.className = 'toast-undo';
      b.textContent = '復原';
      b.onclick = ev => {
        ev.stopPropagation();
        clearTimeout(_toastTimer);
        el.classList.remove('show');
        undo();
      };
      el.appendChild(b);
    }
    el.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => el.classList.remove('show'), undo ? 4500 : 2000);
  }

  /* ── 匯出 CSV ── */
  function exportCSV() {
    const activeRecs = recs.filter(r => !r.deleted);
    if (activeRecs.length === 0) { toast('沒有資料可以匯出'); return; }
    const header = '日期,分類,金額,備註,不計入預算,預算大項,預算細項';
    const cell = s => String(s || '').replace(/,/g, '，').replace(/\n/g, ' ');
    const rows = activeRecs.map(r => {
      const c    = CATS[r.cat] || UNCATEGORIZED;
      const note = cell(r.note);
      const ref  = effBdgRef(r);
      const rym  = (r.date || '').slice(0, 7);
      const bCat = ref ? cell(catLbl(ref.catKey, rym)) : '';
      let bSub = '';
      if (ref && ref.subId !== undefined) {
        const sub = (bdgPlan[ref.catKey] && bdgPlan[ref.catKey].subs || []).find(s => s.id === ref.subId);
        bSub = sub ? cell(subName(sub, rym)) : '';
      }
      return `${r.date},${cell(CATS[r.cat] ? catLbl(r.cat, rym) : c.lbl)},${r.amt},${note},${r.exempt ? '是' : ''},${bCat},${bSub}`;
    });
    const csv  = '\uFEFF' + header + '\n' + rows.join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    const now  = new Date();
    a.href     = url;
    a.download = `記帳_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('已匯出 CSV ↓');
  }

  /* ── 備份 JSON（完整資料） ── */
  function backupJSON() {
    const payload = {
      v: 3,
      ts: Date.now(),
      recs: recs.filter(r => !r.deleted),
      bdgPlan,            // 含各月份預算紀錄（_hist）
      budget,             // 頂部「每月支出上限」
      totalMode,
      catsList: CATS_LIST,
      labels: (() => { try { return JSON.parse(localStorage.getItem(SK_LBL) || '{}'); } catch(e) { return {}; } })(),
    };
    const json = JSON.stringify(payload);
    const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    const now  = new Date();
    a.href     = url;
    a.download = `記帳備份_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('已備份 JSON ↓');
    closeBackupMenu();
  }

  /* ── Firebase 同步 ── */
  function _fbGetUserCol() {
    if (!window._fb || !window._fbUser) return null;
    return window._fb.collection(window._fb.db, 'users', window._fbUser.uid, 'recs');
  }

  /* ── 同步狀態（顯示在「備份 & 還原」選單） ── */
  let _syncFailAt = 0;
  const SK_LASTSYNC = 'kakeibo_last_sync';
  function markSyncOk()   { _syncFailAt = 0; try { localStorage.setItem(SK_LASTSYNC, String(Date.now())); } catch(e) {} }
  function markSyncFail() { _syncFailAt = Date.now(); }
  function syncStatusText() {
    let last = 0;
    try { last = parseInt(localStorage.getItem(SK_LASTSYNC), 10) || 0; } catch(e) {}
    if (!navigator.onLine) return '📴 目前離線，改動已存在本機，連線後會自動補同步';
    if (_syncFailAt && _syncFailAt >= last) return '⚠️ 最近一次同步失敗，請確認網路後再試一次';
    if (!last) return '☁️ 尚未同步過（新增或修改記帳後會自動同步）';
    const min = Math.floor((Date.now() - last) / 60000);
    const ago = min < 1 ? '剛剛' : min < 60 ? min + ' 分鐘前' : min < 1440 ? Math.floor(min / 60) + ' 小時前' : Math.floor(min / 1440) + ' 天前';
    return '☁️ 上次同步成功：' + ago;
  }

  async function fbSyncRec(rec) {
    try {
      if (!navigator.onLine) return;   // 離線：本機已存，下次連線時會自動補同步
      const col = _fbGetUserCol();
      if (!col) return;
      const { doc, setDoc } = window._fb;
      await setDoc(doc(window._fb.db, 'users', window._fbUser.uid, 'recs', String(rec.id)), rec);
      markSyncOk();
    } catch(e) {
      markSyncFail();
      console.error('[FB] syncRec failed', e);
    }
  }

  async function fbDeleteRec(id) {
    try {
      if (!navigator.onLine || !window._fb || !window._fbUser) return;
      const { doc, deleteDoc } = window._fb;
      await deleteDoc(doc(window._fb.db, 'users', window._fbUser.uid, 'recs', String(id)));
    } catch(e) {
      console.error('[FB] deleteRec failed', e);
    }
  }

  async function fbSyncMeta(key, value) {
    try {
      if (!navigator.onLine) {
        // 離線改動設定：記下來，恢復連線後以本機設定為準推上雲端
        try { localStorage.setItem('kakeibo_meta_dirty', '1'); } catch(e) {}
        return false;
      }
      if (!window._fb || !window._fbUser) return false;
      const { doc, setDoc } = window._fb;
      await setDoc(doc(window._fb.db, 'users', window._fbUser.uid, 'meta', key), { value });
      markSyncOk();
      return true;
    } catch(e) {
      markSyncFail();
      console.error('[FB] syncMeta failed', e);
      return false;
    }
  }

  async function fbLoadAll() {
    if (!window._fb || !window._fbUser) return [];
    const { db, collection, getDocs, doc, getDoc } = window._fb;
    const uid = window._fbUser.uid;
    // 讀取 recs — 只回傳，不覆寫全域 recs
    let cloudRecs = [];
    try {
      const snap = await getDocs(collection(db, 'users', uid, 'recs'));
      window._fbRecsLoadOk = true;
      if (!snap.empty) {
        cloudRecs = snap.docs.map(d => d.data());
        cloudRecs.sort((a, b) => b.id - a.id);
      }
    } catch(e) { console.error('[FB] loadRecs failed', e); }
    // 讀取 meta（分類、預算等）— 這些仍直接套用，沒有衝突問題
    // 離線期間改過分類／預算：以本機為準推上雲端，不讓舊的雲端設定蓋掉
    let metaDirty = false;
    try { metaDirty = localStorage.getItem('kakeibo_meta_dirty') === '1'; } catch(e) {}
    if (metaDirty) {
      const oks = await Promise.all([
        fbSyncMeta(SK_CATS, JSON.stringify(CATS_LIST)),
        fbSyncMeta(SK_BDG, String(budget)),
        fbSyncMeta(SK_BDGPLAN, JSON.stringify(bdgPlan))
      ]);
      if (oks.every(Boolean)) { try { localStorage.removeItem('kakeibo_meta_dirty'); } catch(e) {} }
      return cloudRecs;
    }
    const metaKeys = [SK_CATS, SK_BDG, SK_MODE, SK_BDGPLAN];
    for (const k of metaKeys) {
      try {
        const snap = await getDoc(doc(db, 'users', uid, 'meta', k));
        if (snap.exists()) {
          const v = snap.data().value;
          if (k === SK_CATS) {
            const saved = JSON.parse(v);
            if (Array.isArray(saved) && saved.length > 0) CATS_LIST = saved;
          } else if (k === SK_BDG) {
            budget = parseInt(v, 10) || 0;
          } else if (k === SK_MODE) {
            totalMode = parseTotalMode(v);
          } else if (k === SK_BDGPLAN) {
            const saved = JSON.parse(v);
            if (typeof saved === 'object' && !Array.isArray(saved)) {
              bdgPlan = saved;
              Object.values(bdgPlan).forEach(p => {
                (p.subs||[]).forEach(s => { if (s.id >= _subId) _subId = s.id + 1; });
              });
            }
          }
        }
      } catch(e) { console.error('[FB] loadMeta failed', k, e); }
    }
    return cloudRecs;
  }

  /* ── 還原 JSON ── */
  function restoreJSON() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.onchange = async e => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        if (!data.recs || !Array.isArray(data.recs)) throw new Error('格式錯誤');
        // 確認
        const ok = confirm(`還原備份？\n共 ${data.recs.length} 筆記錄\n備份時間：${data.ts ? new Date(data.ts).toLocaleString() : '未知'}\n\n備份資料將與雲端合併，兩邊記錄都會保留。`);
        if (!ok) return;

        // 先從 Firebase 讀取雲端資料（暫存，不覆蓋現有 recs）
        toast('☁️ 正在讀取雲端資料…');
        let cloudRecs = [];
        try {
          if (window._fb && window._fbUser) {
            const { db, collection, getDocs } = window._fb;
            const snap = await getDocs(collection(db, 'users', window._fbUser.uid, 'recs'));
            if (!snap.empty) cloudRecs = snap.docs.map(d => d.data());
          }
        } catch(e) { console.error('[restore] fbLoad failed', e); }

        // 合併：比 updatedAt，誰新誰贏；雲端沒有的補入
        const newRecs = [];
        const merged  = new Map();
        cloudRecs.forEach(r => merged.set(r.id, r));
        data.recs.forEach(r => {
          if (!merged.has(r.id)) {
            merged.set(r.id, r);
            newRecs.push(r);
          } else {
            const cloud   = merged.get(r.id);
            const backupTs = r.updatedAt || 0;
            const cloudTs  = cloud.updatedAt || 0;
            // 雲端那筆是「已刪除」而備份裡還在 → 視為使用者要還原（例如清空後想救回），以備份為準
            const revive = cloud.deleted && !r.deleted;
            if (revive || backupTs > cloudTs) {
              const rr = revive ? { ...r, updatedAt: Date.now() } : r;
              merged.set(r.id, rr);
              newRecs.push(rr); // 也要上傳更新雲端（讓其他裝置一起還原）
            }
          }
        });
        recs = [...merged.values()].sort((a, b) => b.id - a.id);

        if (data.bdgPlan && typeof data.bdgPlan === 'object') bdgPlan = data.bdgPlan;
        // 舊備份沒有這兩個欄位 → 不覆蓋現有設定
        if (typeof data.budget === 'number' && data.budget >= 0) { budget = data.budget; saveBdg(); }
        if (typeof data.totalMode === 'number') { totalMode = parseTotalMode(String(data.totalMode)); saveMode(); }
        else if (typeof data.showBudgetTotal === 'boolean') { totalMode = data.showBudgetTotal ? 1 : 0; saveMode(); }  // 舊備份
        if (Array.isArray(data.catsList) && data.catsList.length > 0) CATS_LIST = data.catsList;
        rebuildCats();
        if (CKEYS.length > 0 && !CKEYS.includes(cat)) cat = CKEYS[0];
        initBdgPlan();

        // 用比所有現有 id 都大的值當 _nextId，避免衝突
        _nextId = recs.length > 0
          ? Math.max(Date.now(), Math.max(...recs.map(r => r.id)) + 1)
          : Date.now();

        save();
        saveBdgPlan();
        saveCats();
        renderCatBtns();
        render();
        closeBackupMenu();

        // 只上傳備份檔裡有、雲端沒有的筆數
        if (newRecs.length > 0) {
          const total = newRecs.length;
          let uploaded = 0;
          for (const r of newRecs) {
            await fbSyncRec(r);
            uploaded++;
            if (uploaded % 5 === 0 || uploaded === total) {
              toast(`⏫ 同步中… ${uploaded} / ${total} 筆`);
            }
          }
          await fbSyncMeta(SK_BDGPLAN, JSON.stringify(bdgPlan));
          await fbSyncMeta(SK_CATS, JSON.stringify(CATS_LIST));
          toast(`✅ 已補上 ${newRecs.length} 筆到 Firebase`);
        } else {
          toast('✅ 備份與雲端已完全一致，無需同步');
        }
      } catch(err) {
        toast('❌ 還原失敗：' + err.message);
      }
    };
    input.click();
  }

  /* ── 備份選單 ── */
  async function forceLoadFromCloud() {
    if (!window._fb || !window._fbUser) {
      toast('⚠️ 請先登入 Google 帳號');
      return;
    }
    const ok = confirm('從 Firebase 強制讀取資料？\n本地資料將被雲端覆蓋。');
    if (!ok) return;
    toast('☁️ 正在從雲端讀取…');
    try {
      const { db, collection, getDocs } = window._fb;
      const snap = await getDocs(collection(db, 'users', window._fbUser.uid, 'recs'));
      if (snap.empty) {
        toast('⚠️ 雲端沒有資料');
        return;
      }
      recs = snap.docs.map(d => d.data());
      recs.sort((a, b) => b.id - a.id);
      _nextId = recs.length > 0 ? Math.max(Date.now(), Math.max(...recs.map(r => r.id)) + 1) : Date.now();
      save();
      render();
      closeBackupMenu();
      toast('✅ 已從雲端讀取 ' + recs.length + ' 筆資料');
    } catch(e) {
      console.error('[forceLoad] error', e);
      toast('❌ 讀取失敗：' + e.message);
    }
  }

  // 不用 prompt()：PWA／獨立視窗模式下 prompt 常被瀏覽器擋掉，直接回傳 null，看起來就是「點了沒反應」
  function askClearConfirm(count) {
    return new Promise(resolve => {
      const old = document.getElementById('clearConfirmOverlay');
      if (old) old.remove();
      const ov = document.createElement('div');
      ov.id = 'clearConfirmOverlay';
      ov.style.cssText = 'position:fixed;inset:0;z-index:600;background:rgba(74,58,58,0.55);display:flex;align-items:center;justify-content:center;padding:20px';
      ov.innerHTML =
        '<div style="background:var(--card);border-radius:20px;padding:20px 18px;width:100%;max-width:340px;box-shadow:0 8px 32px rgba(0,0,0,.25)">' +
          '<div style="font-size:15px;font-weight:700;color:var(--danger);margin-bottom:8px">清空記帳明細</div>' +
          '<div style="font-size:12.5px;color:var(--text);line-height:1.7;margin-bottom:12px">即將清空全部 ' + count + ' 筆記帳明細。<br>分類、順序與預算設定會保留。<br>會先自動下載一份備份。<br>請輸入「清空」確認：</div>' +
          '<input id="clearConfirmInp" type="text" autocomplete="off" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1.5px solid var(--bdr);border-radius:12px;background:transparent;color:var(--text);font-size:16px;font-family:inherit;outline:none;-webkit-user-select:auto;user-select:auto">' +
          '<div style="display:flex;gap:10px;margin-top:14px">' +
            '<button id="clearConfirmNo" style="flex:1;padding:11px 0;border-radius:50px;border:none;background:rgba(220,170,170,0.18);color:var(--muted);font-size:13px;font-weight:700;font-family:inherit;cursor:pointer">取消</button>' +
            '<button id="clearConfirmOk" style="flex:1;padding:11px 0;border-radius:50px;border:none;background:var(--danger);color:#fff;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer">清空</button>' +
          '</div></div>';
      document.body.appendChild(ov);
      const inp = ov.querySelector('#clearConfirmInp');
      const done = v => { ov.remove(); resolve(v); };
      ov.querySelector('#clearConfirmNo').onclick = () => done(null);
      ov.querySelector('#clearConfirmOk').onclick = () => done(inp.value);
      ov.addEventListener('click', e => { if (e.target === ov) done(null); });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') done(inp.value); });
      setTimeout(() => { try { inp.focus(); } catch(e) {} }, 50);
    });
  }

  async function clearAllRecords() {
    closeBackupMenu();
    const active = recs.filter(r => !r.deleted);
    if (active.length === 0) { toast('目前沒有記帳明細'); return; }
    if (window._fbUser && !navigator.onLine) {
      alert('目前離線，請連上網路後再清空，才能同步到雲端和其他裝置。');
      return;

    const ans = await askClearConfirm(active.length);
    if (ans === null) return;
    if (ans.trim() !== '清空') { toast('已取消，沒有清空'); return; }

    try { backupJSON(); } catch(e) { console.error('[clear] backup failed', e); }   // 先備份（此時還沒標記刪除）
    await new Promise(res => setTimeout(res, 700)); // 讓下載先啟動

    const now = Date.now();
    active.forEach(r => { r.deleted = true; r.deletedAt = now; r.updatedAt = now; });
    save();
    render();
    toast('正在同步到雲端…');
    await Promise.all(active.map(r => fbSyncRec(r)));
    toast('✅ 已清空 ' + active.length + ' 筆記帳明細');
  }

  /* ── Swipe on scroll area ── */
  function setupSwipe() {
    const area = document.getElementById('scrollArea');
    const tabOrder = ['list', 'ana', 'bdgplan'];
    let sx = 0, sy = 0, tracking = false, dirLocked = false, isHoriz = false, touchId = null;

    const getWrap = () => document.getElementById('panelWrap');

    // 目前 tab 對應的 translateX 基準值
    const baseX = () => -tabOrder.indexOf(ctab) * 33.333;

    // 不管手勢怎麼中斷（多指、被系統搶走、App 切到背景…），一律回到「目前分頁」的正確位置，避免卡在半途
    const resetSwipe = () => {
      tracking = false; dirLocked = false; isHoriz = false; touchId = null;
      const w = getWrap();
      if (w) {
        w.classList.remove('notransition');
        w.style.transform = `translateX(${baseX()}%)`;
      }
      settlePanels(380);
    };

    // 保險：放手後 0.6 秒若位置還不對（transform 殘留、notransition 沒拿掉），強制校正
    let _guardTimer = null;
    const armGuard = () => {
      clearTimeout(_guardTimer);
      _guardTimer = setTimeout(() => {
        if (tracking) return;   // 又開始新的滑動就不干擾
        const w = getWrap();
        if (!w) return;
        w.classList.remove('notransition');
        const want = `translateX(${baseX()}%)`;
        if (w.style.transform.replace(/\s/g, '') !== want.replace(/\s/g, '')) w.style.transform = want;
        settlePanels(0);
      }, 600);
    };

    const findTouch = (list) => {
      for (let i = 0; i < list.length; i++) if (list[i].identifier === touchId) return list[i];
      return null;
    };

    document.addEventListener('touchstart', e => {
      // 多指：如果正在拖曳，直接收回，不要讓畫面卡在半途
      if (e.touches.length !== 1) {
        if (tracking && isHoriz) resetSwipe(); else tracking = false;
        return;
      }
      tracking = false;
      // 只處理內容區與空白處；標題列、記帳區、彈窗、輸入框、子分類面板都不算
      if (e.target.closest('#topBar, #kb, .sub-pop, [id$="Overlay"], input, textarea, select')) return;
      clearTimeout(_guardTimer);
      const t = e.touches[0];
      touchId = t.identifier;
      sx = t.clientX;
      sy = t.clientY;
      tracking = true;
      dirLocked = false;
      isHoriz   = false;
      // 若上一次切換動畫還沒跑完，先讓畫面定在它目前的位置，不要在動畫中途開始拖
      // （確認是水平滑才關 transition）
    }, { passive: true });

    document.addEventListener('touchmove', e => {
      if (!tracking) return;
      const t = findTouch(e.touches);
      if (!t) return;
      const dx = t.clientX - sx;
      const dy = t.clientY - sy;

      if (!dirLocked) {
        if (Math.abs(dx) < 5 && Math.abs(dy) < 5) return;
        isHoriz   = Math.abs(dx) > Math.abs(dy);
        dirLocked = true;
        if (isHoriz) {
          // 確認是水平滑才關掉 transition，讓 panel 直接跟手
          const w = getWrap();
          if (w) w.classList.add('notransition');
          unsettlePanels();                // 滑動中兩個分頁都要可見
        }
      }
      if (!isHoriz) return;

      const idx    = tabOrder.indexOf(ctab);
      const atLeft  = idx === 0 && dx > 0;
      const atRight = idx === tabOrder.length - 1 && dx < 0;
      const move    = (atLeft || atRight) ? dx * 0.25 : dx;

      const screenW = area.offsetWidth || window.innerWidth;
      const movePct = (move / screenW) * 33.333;
      const w = getWrap();
      if (w) w.style.transform = `translateX(${baseX() + movePct}%)`;
    }, { passive: true });

    const endSwipe = e => {
      if (!tracking) return;
      const t = findTouch(e.changedTouches);
      if (!t) return;            // 不是我們追蹤的那根手指放開
      tracking = false;

      const w = getWrap();
      if (!isHoriz) {
        // 純直向捲動，什麼都不做
        if (w) w.classList.remove('notransition');
        return;
      }

      // 恢復 transition（先移除 class，讓後續 transform 有動畫）
      if (w) w.classList.remove('notransition');

      const dx = t.clientX - sx;
      const screenW = area.offsetWidth || window.innerWidth;
      const threshold = screenW * 0.2;
      const idx = tabOrder.indexOf(ctab);

      try {
        if (dx < -threshold && idx < tabOrder.length - 1) {
          goTab(tabOrder[idx + 1]);
        } else if (dx > threshold && idx > 0) {
          goTab(tabOrder[idx - 1]);
        } else {
          // 未達門檻，用動畫彈回原位
          if (w) w.style.transform = `translateX(${baseX()}%)`;
          settlePanels(380);
        }
      } catch (err) {
        console.error('[swipe] goTab failed', err);
        resetSwipe();
      }
      armGuard();
    };

    document.addEventListener('touchend', endSwipe, { passive: true });
    document.addEventListener('touchcancel', () => { resetSwipe(); armGuard(); }, { passive: true });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') resetSwipe(); });
    window.addEventListener('blur', () => { if (tracking && isHoriz) resetSwipe(); });
  }

  /* ── 效能量測（只有網址加 ?perf=1 才啟用，?perf=0 關閉；沒開啟時什麼都不做） ──
     滑一次畫面後，會在畫面上方列出：手指滑動中／放開後 各有哪些卡頓、卡多久、是哪段程式造成的 */
  (function perfProbe() {
    try {
      const q = new URLSearchParams(location.search).get('perf');
      if (q === '1') localStorage.setItem('kk_perf', '1');
      if (q === '0') localStorage.removeItem('kk_perf');
      if (localStorage.getItem('kk_perf') !== '1') return;
    } catch (e) { return; }

    const box = document.createElement('div');
    box.id = 'perfBox';
    box.style.cssText = 'position:fixed;left:4px;right:4px;top:4px;z-index:100000;max-height:55vh;overflow:hidden;' +
      'pointer-events:none;background:rgba(0,0,0,.84);color:#9f9;font:10px/1.4 monospace;padding:6px 8px;' +
      'border-radius:8px;white-space:pre-wrap;word-break:break-all;';
    box.textContent = '效能量測已開啟：請左右滑一次切換分頁，結果會顯示在這裡（時間單位 ms，@ 後面是從手指碰到螢幕起算）';
    document.body.appendChild(box);

    let g = null, n = 0, raf = 0, lastF = 0;
    const buf = [];       // longtask / long-animation-frame 紀錄
    const reports = [];

    try {
      new PerformanceObserver(l => { for (const en of l.getEntries()) buf.push({ k: 'longtask', s: en.startTime, d: en.duration }); })
        .observe({ entryTypes: ['longtask'] });
    } catch (e) {}
    try {
      new PerformanceObserver(l => {
        for (const en of l.getEntries()) {
          const sc = (en.scripts || []).map(x =>
            (x.invoker || x.sourceFunctionName || '?') + ' ' + Math.round(x.duration) + 'ms' +
            (x.forcedStyleAndLayoutDuration ? '(強制排版' + Math.round(x.forcedStyleAndLayoutDuration) + ')' : '')
          ).join('; ');
          buf.push({
            k: 'LoAF', s: en.startTime, d: en.duration,
            script: en.renderStart ? Math.round(en.renderStart - en.startTime) : null,                   // 程式執行到開始渲染
            render: en.renderStart ? Math.round(en.startTime + en.duration - en.renderStart) : null,    // 渲染（排版+繪製）
            sc
          });
        }
      }).observe({ type: 'long-animation-frame', buffered: false });
    } catch (e) {}

    const mark = (name, start, dur) => { if (g && !g.done) g.marks.push({ name, at: start - g.t0, dur }); };
    try {
      const _goTab = goTab;
      goTab = function (t) { const st = performance.now(); try { return _goTab.apply(this, arguments); } finally { mark('goTab(' + t + ')', st, performance.now() - st); } };
      const _render = render;
      render = function () { const st = performance.now(); try { return _render.apply(this, arguments); } finally { mark('render', st, performance.now() - st); } };
    } catch (e) {}

    const loop = t => {
      if (!g || g.done) { raf = 0; return; }
      if (lastF && t - lastF > 34) g.frames.push({ at: t - g.t0, d: t - lastF });
      lastF = t;
      raf = requestAnimationFrame(loop);
    };

    document.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) return;
      if (e.target.closest && e.target.closest('#kb')) return;
      if (g && !g.done) finish();
      g = { t0: performance.now(), tab0: ctab, moves: 0, last: null, maxGap: 0, maxGapAt: 0, maxQ: 0,
            release: null, frames: [], marks: [], done: false };
      lastF = 0;
      if (!raf) raf = requestAnimationFrame(loop);
    }, true);

    document.addEventListener('touchmove', e => {
      if (!g || g.done) return;
      const now = performance.now();
      if (g.last != null && now - g.last > g.maxGap) { g.maxGap = now - g.last; g.maxGapAt = now - g.t0; }
      g.last = now; g.moves++;
      const q = now - e.timeStamp;                      // 事件從發生到被處理，在佇列裡等了多久
      if (q > 0 && q < 5000 && q > g.maxQ) g.maxQ = q;
    }, true);

    const end = () => {
      if (!g || g.done || g.release != null) return;
      g.release = performance.now();
      const mine = g;
      setTimeout(() => { if (g === mine) finish(); }, 1000);
    };
    document.addEventListener('touchend', end, true);
    document.addEventListener('touchcancel', end, true);

    function finish() {
      if (!g || g.done) return;
      const e = g; e.done = true;
      const rel = e.release != null ? e.release - e.t0 : performance.now() - e.t0;
      const ph = at => (e.release != null && at > rel) ? '放開後' : '滑動中';
      const R = Math.round;
      const L = [];
      L.push('#' + (++n) + '  分頁 ' + e.tab0 + ' → ' + ctab + '｜手指 ' + R(rel) + 'ms｜DOM ' + document.getElementsByTagName('*').length + ' 個');
      L.push('touchmove ' + e.moves + ' 次｜最大間隔 ' + R(e.maxGap) + 'ms @' + R(e.maxGapAt) + '｜事件最長等待 ' + R(e.maxQ) + 'ms');
      const fr = e.frames.slice().sort((a, b) => b.d - a.d);
      L.push('掉幀(>34ms) ' + e.frames.length + ' 次' + (fr.length ? '，最長 ' + R(fr[0].d) + 'ms' : ''));
      fr.slice(0, 4).forEach(f => L.push('  ・' + R(f.d) + 'ms @' + R(f.at) + ' (' + ph(f.at) + ')'));
      const ms = e.marks.filter(m => m.dur >= 4);
      ms.forEach(m => L.push('函式 ' + m.name + ' @' + R(m.at) + ' 花 ' + R(m.dur) + 'ms (' + ph(m.at) + ')'));
      const hi = buf.filter(b => b.s >= e.t0 - 30 && b.s <= e.t0 + rel + 1200);
      hi.filter(b => b.k === 'LoAF').slice(0, 4).forEach(b => {
        const at = b.s - e.t0;
        L.push('LoAF @' + R(at) + ' 共 ' + R(b.d) + 'ms (' + ph(at) + ')' +
          (b.script != null ? '｜程式 ' + b.script + 'ms＋渲染 ' + b.render + 'ms' : '') + (b.sc ? '｜' + b.sc : ''));
      });
      hi.filter(b => b.k === 'longtask').slice(0, 4).forEach(b => {
        const at = b.s - e.t0; L.push('longtask @' + R(at) + ' ' + R(b.d) + 'ms (' + ph(at) + ')');
      });
      reports.unshift(L.join('\n'));
      if (reports.length > 3) reports.pop();
      box.textContent = reports.join('\n──────\n');
    }
  })();

  init();
</script>
</body>
